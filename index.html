<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rak Aquarium 10 Slot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#cfefff;padding:10px;display:flex;justify-content:center}
.phone{width:400px;background:#e6f7ff;border-radius:20px;padding:12px;border:3px solid #fff}
.top{background:#2d3a8c;color:#fff;border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between}
.rack{background:#c19a6b;border-radius:16px;padding:10px;margin:12px 0;box-shadow:inset 0 0 0 4px #8b5a2b}
.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;margin:8px 0}
.tank{background:linear-gradient(#a8e6ff,#fff);border:3px solid #fff;border-radius:12px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.tank.empty{background:#fff;border-style:dashed}
.fish{font-size:36px;animation:swim 2s infinite alternate}
@keyframes swim{to{transform:translateX(4px)}}
.label{position:absolute;bottom:-8px;background:#ff5a8a;color:#fff;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:800}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.b{border:none;border-radius:12px;padding:10px;font-weight:800;color:#fff}
.feed{background:#2ecc71}.clean{background:#3498db}.breed{background:#9b59b6}
.count{text-align:center;margin-top:8px;font-weight:800;color:#2d3a8c}
</style>
</head>
<body>
<div class="phone">
<div class="top"><b>RAK #1 - 10 SLOT</b><span id="count">0/10</span></div>
<div class="rack" id="rack"></div>
<div class="count">Maksimum 10 Aquarium per Rak!</div>
<div class="btns">
<button class="b feed" onclick="feedAll()">Feed All</button>
<button class="b clean" onclick="cleanAll()">Clean</button>
<button class="b breed" onclick="breed()">Breed</button>
</div>
<div id="log" style="background:#0a2a3a;color:#7fff9f;padding:8px;border-radius:10px;margin-top:10px;font-size:12px;height:60px;overflow:auto">> Rak siap bree, isi ikan!</div>
</div>
<script>
let tanks=Array(10).fill(null);
let fishes=['🔴','🔵','🟠','🟡','🟣','🟢','⚫','⚪','🟤','🔴'];
let names=['Ruby','Aqua','Violet','Sunny','Lemon','Tide','Rosy','Moss','Cosmo','Pearl'];
function render(){
 let r=document.getElementById('rack'); r.innerHTML='';
 let row1=document.createElement('div'); row1.className='row';
 let row2=document.createElement('div'); row2.className='row';
 tanks.forEach((f,i)=>{
   let d=document.createElement('div'); d.className=f?'tank':'tank empty';
   if(f){d.innerHTML=`<div class="fish">${f.emoji}</div><div class="label">${f.name}</div>`}else{d.innerHTML='<div style="font-size:24px">+</div>'}
   d.onclick=()=>clickTank(i);
   if(i<5) row1.appendChild(d); else row2.appendChild(d);
 });
 r.appendChild(row1); r.appendChild(document.createElement('br')); r.appendChild(row2);
 document.getElementById('count').innerText=tanks.filter(x=>x).length+'/10';
}
function clickTank(i){
 if(!tanks[i]){
   if(tanks.filter(x=>x).length>=10){log('Rak penuh bree! Max 10!');return;}
   tanks[i]={emoji:fishes[i],name:names[i],happy:true};
   log('Isi '+names[i]+' di slot '+(i+1));
 }else{
   log('Kasih makan '+tanks[i].name+' - Happy!'); tanks[i].happy=true;
 }
 render();
}
function feedAll(){log('Feed All 10 aquarium!'); render();}
function cleanAll(){log('Bersihin semua tank!');}
function breed(){
 let isi=tanks.filter(x=>x).length;
 if(isi<2){log('Butuh 2 ikan buat breed!');return;}
 if(isi>=10){log('Rak penuh! Gak bisa breed, jual dulu!');return;}
 let kosong=tanks.findIndex(x=>!x);
 tanks[kosong]={emoji:'🐟',name:'Burayak',happy:true};
 log('Breed sukses! Burayak di slot '+(kosong+1)); render();
}
function log(t){let l=document.getElementById('log'); l.innerHTML+='> '+t+'<br>'; l.scrollTop=999;}
render();
</script>
</body>
</html>
