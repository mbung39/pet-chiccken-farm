<script>
const ADMIN_WA = "6285143890586";
const ADMIN_CODE = "kenpop123";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTe8t2UIqM_mxzxCjZiVsfomW2qsmdOsaigTBa92vbCCBvkmdlY4Jse_Dbxiei2Fzznw/exec";

let dataStrukTerakhir = null; 

let currentWA = "";
function getKey(key){ return key + '_' + currentWA; }

let historyTukar = [];
let coins, power, auto, pAds, aAds, autoEnd, pTimer, aTimer;
let powerLockEnd, autoLockEnd;
let coinsTxt, powerNowTxt, btnPower, btnAuto;
let autoInterval, powerLockTimer, autoLockTimer, cooldownInterval;

function getCooldownPower(index){
  if(index === 0) return 15000;
  if(index === 1) return 20000;
  return 30000;
}
function getCooldownAuto(index){
  if(index === 0) return 15000;
  if(index === 1) return 20000;
  if(index === 2) return 30000;
  return 15000;
}

function hubungiAdmin(){
  let pesan = `Halo Admin KenPOP, saya butuh bantuan akun saya terkunci nomer yang alah.`;
  let linkWA = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(pesan)}`;
  window.open(linkWA, '_blank');
}

function resetAdmin(){
  let kode = prompt("Masukkan kode admin:");
  if(kode === ADMIN_CODE){
    if(confirm(`YAKIN HAPUS TOTAL DATA AKUN ${localStorage.kenpopWA}?`)){
      let wa = localStorage.kenpopWA;
      
      localStorage.removeItem('kenpopWA');
      localStorage.removeItem('kenpopNama');
      localStorage.removeItem('coins_' + wa);
      localStorage.removeItem('power_' + wa);
      localStorage.removeItem('auto_' + wa);
      localStorage.removeItem('pAds_' + wa);
      localStorage.removeItem('aAds_' + wa);
      localStorage.removeItem('autoEnd_' + wa);
      localStorage.removeItem('pTimer_' + wa);
      localStorage.removeItem('aTimer_' + wa);
      localStorage.removeItem('lastLogin_' + wa);
      localStorage.removeItem('historyTukar_' + wa);
      localStorage.removeItem('powerLockEnd_' + wa);
      localStorage.removeItem('autoLockEnd_' + wa);
      
      alert("✅ DATA TOTAL TERHAPUS! HP sudah bisa daftar ulang dari 0");
      location.reload();
    }
  } else {
    alert("❌ Kode salah!");
  }
}

window.onload = function() {
  if(localStorage.kenpopNama && localStorage.kenpopWA) {
    currentWA = localStorage.kenpopWA;
    historyTukar = JSON.parse(localStorage[getKey('historyTukar')] || "[]");
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('welcomeBox').style.display = 'block';
    document.getElementById('w-nama').innerText = localStorage.kenpopNama;
    document.getElementById('w-wa').innerText = currentWA;
    loadData();
  }

  document.getElementById('logo').onclick = (e) => {
    if(!currentWA) return;
    let totalKlik = power + auto;
    coins += totalKlik; showPlus('+'+totalKlik, e); save();
  }

  startCooldownTimer();
}

async function login() {
  const nama = document.getElementById('nama').value.trim();
  const wa = document.getElementById('wa').value.trim();
  const btn = document.querySelector('.btn-login');

  if(!nama ||!wa) { alert('Nama dan WA wajib diisi!'); return; }
  if(!wa.startsWith('08')) { alert('No WA harus diawali 08'); return; }

  if(localStorage.kenpopWA){
    if(localStorage.kenpopWA!== wa){
      let pesan = `Halo Admin KenPOP, saya mau reset akun.\nHP terkunci ke: ${localStorage.kenpopWA}`;
      let linkWA = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(pesan)}`;
      alert(`❌ HP INI SUDAH TERKUNCI!\n\nAkun terdaftar: ${localStorage.kenpopWA}\n\nHP ini tidak bisa ganti akun. Silahkan hubungi admin untuk reset.`);
      window.open(linkWA, '_blank');
      return;
    }
  }

  btn.disabled = true; btn.innerText = 'MEMPROSES...';
  await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({nama, wa, menu:"LOGIN BARU V24.9.1"}) });

  currentWA = wa;
  localStorage.kenpopNama = nama;
  localStorage.kenpopWA = wa;

  if(!localStorage[getKey('coins')]){
    localStorage[getKey('coins')] = 0; localStorage[getKey('power')] = 1; localStorage[getKey('auto')] = 0;
    localStorage[getKey('pAds')] = 0; localStorage[getKey('aAds')] = 0; localStorage[getKey('autoEnd')] = 0;
    localStorage[getKey('pTimer')] = 0; localStorage[getKey('aTimer')] = 0; localStorage[getKey('lastLogin')] = "";
    localStorage[getKey('historyTukar')] = "[]"; localStorage[getKey('powerLockEnd')] = 0; localStorage[getKey('autoLockEnd')] = 0;
  }
  historyTukar = JSON.parse(localStorage[getKey('historyTukar')] || "[]");

  document.getElementById('w-nama').innerText = nama;
  document.getElementById('w-wa').innerText = wa;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('welcomeBox').style.display = 'block';
  alert('Login Berhasil! Selamat bermain');
  loadData();
  btn.disabled = false; btn.innerText = 'MASUK GAME';
}

function logout(){
  if(confirm('Yakin mau logout? \nAkun kamu tetap terkunci di HP ini')){
    save();
    clearInterval(autoInterval); clearInterval(powerLockTimer); clearInterval(autoLockTimer); clearInterval(cooldownInterval);
    localStorage.removeItem('kenpopNama');
    currentWA = "";
    location.reload();
  }
}

function loadData(){
  let today = new Date().toISOString().split('T')[0];
  let lastLogin = localStorage[getKey('lastLogin')] || "";
  if(lastLogin!== today){
    localStorage[getKey('power')] = 1; localStorage[getKey('pAds')] = 0; localStorage[getKey('aAds')] = 0;
    localStorage[getKey('lastLogin')] = today;
    localStorage[getKey('pTimer')] = 0; localStorage[getKey('aTimer')] = 0;
    localStorage[getKey('powerLockEnd')] = 0; localStorage[getKey('autoLockEnd')] = 0;
    if(lastLogin) alert('Selamat Pagi! Bonus Klik +1 direset ke +1');
  }

  coins = +localStorage[getKey('coins')] || 0;
  power = +localStorage[getKey('power')] || 1;
  auto = +localStorage[getKey('auto')] || 0;
  pAds = +localStorage[getKey('pAds')] || 0;
  aAds = +localStorage[getKey('aAds')] || 0;
  autoEnd = +localStorage[getKey('autoEnd')] || 0;
  pTimer = +localStorage[getKey('pTimer')] || 0;
  aTimer = +localStorage[getKey('aTimer')] || 0;
  powerLockEnd = +localStorage[getKey('powerLockEnd')] || 0;
  autoLockEnd = +localStorage[getKey('autoLockEnd')] || 0;

  coinsTxt = document.getElementById('coins');
  powerNowTxt = document.getElementById('powerNow');
  btnPower = document.getElementById('btnPower');
  btnAuto = document.getElementById('btnAuto');

  if(auto > 0 && Date.now() < autoEnd){
    startAutoClick();
  }
  if(Date.now() < powerLockEnd){
    lockPowerButton(powerLockEnd - Date.now());
  }
  if(Date.now() < autoLockEnd){
    lockAutoButton(autoLockEnd - Date.now());
  }

  btnPower.onclick = () => {
    if(power >= 10) { // MENTOK DI +10
      alert('🔥 Upgrade Klik +1 sudah mentok di +10');
      return; 
    }
    let cooldown = getCooldownPower(pAds);
    if(Date.now() - pTimer < cooldown) return;
    pAds++; pTimer = Date.now();
    if(pAds >= 3){
      if(power < 10) power++; // MENTOK DI +10
      pAds = 0;
      alert(`Klik +1 Naik! Sekarang Total = +${power}`);
    }
    if(pAds >= 2){
      powerLockEnd = Date.now() + 600000;
      lockPowerButton(600000);
    }
    save();
  }

  btnAuto.onclick = () => {
    let cooldown = getCooldownAuto(aAds);
    if(Date.now() - aTimer < cooldown) return;
    aAds++; aTimer = Date.now();
    if(aAds >= 6){
      auto=power; autoEnd=Date.now()+3600000;
      autoLockEnd = autoEnd;
      aAds=0;
      startAutoClick();
      lockAutoButton(3600000);
      alert('Auto Aktif 1 Jam!');
    }
    save();
  }

  save();
  setInterval(save, 1000);
}

function startCooldownTimer(){
  clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    if(!btnPower ||!btnAuto) return;
    if(Date.now() < powerLockEnd){
      updatePowerTimer(powerLockEnd - Date.now());
    } else {
      cekValidasi('power');
    }
    if(Date.now() < autoLockEnd){
      updateAutoTimer(autoLockEnd - Date.now());
    } else {
      cekValidasi('auto');
    }
  }, 1000);
}

function startAutoClick(){
  clearInterval(autoInterval);
  autoInterval = setInterval(() => {
    if(Date.now() > autoEnd){
      auto = 0; autoLockEnd = 0;
      clearInterval(autoInterval);
      save();
      return;
    }
    coins += auto;
    save();
  }, 1000);
}

function lockPowerButton(duration){
  btnPower.disabled = true;
  updatePowerTimer(duration);
  clearInterval(powerLockTimer);
  powerLockTimer = setInterval(() => {
    duration = powerLockEnd - Date.now();
    if(duration <= 0){
      clearInterval(powerLockTimer);
      powerLockEnd = 0;
      pAds = 0;
      cekValidasi('power');
      save();
      return;
    }
  }, 1000);
}

function lockAutoButton(duration){
  btnAuto.disabled = true;
  updateAutoTimer(duration);
  clearInterval(autoLockTimer);
  autoLockTimer = setInterval(() => {
    duration = autoLockEnd - Date.now();
    if(duration <= 0){
      clearInterval(autoLockTimer);
      autoLockEnd = 0;
      cekValidasi('auto');
      save();
      return;
    }
  }, 1000);
}

function updatePowerTimer(ms){
  btnPower.innerText = `🔒 Tunggu ${formatTime(ms)}`;
}

function updateAutoTimer(ms){
  btnAuto.innerText = `🔒 ${formatTime(ms)}`;
}

function cekValidasi(type){
  let btn = type==='power'? btnPower : btnAuto;
  let timer = type==='power'? pTimer : aTimer;
  let ads = type==='power'? pAds : aAds;
  let cooldown = type==='power'? getCooldownPower(ads) : getCooldownAuto(ads);

  if(type === 'power' && Date.now() < powerLockEnd) return;
  if(type === 'auto' && Date.now() < autoLockEnd) return;

  if(timer > 0 && Date.now() - timer < cooldown){
    let sisa = Math.ceil((cooldown - (Date.now() - timer))/1000);
    btn.disabled = true; btn.innerText = `Tunggu ${sisa}s...`;
  } else {
    btn.disabled = false;
    if(type==='power') btn.innerText = `Validasi ${ads}/3`;
    if(type==='auto') btn.innerText = `Validasi ${ads}/6`;
  }
}

function formatTime(ms) {
  let totalSec = Math.floor(ms / 1000);
  let hours = Math.floor(totalSec / 3600);
  let minutes = Math.floor((totalSec % 3600) / 60);
  let seconds = totalSec % 60;
  if(hours > 0) return `${hours}j ${minutes}m ${seconds}d`;
  return `${minutes}m ${seconds}d`;
}

function showPlus(txt,e){
  let d=document.createElement('div'); d.id='float'; d.innerText=txt;
  d.style.left=e.clientX-20+'px'; d.style.top=e.clientY-20+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),800);
}

function bukaPopupTukar(){ document.getElementById('popupTukar').style.display='flex'; }
function bukaPopupHistory(){ renderHistory(); document.getElementById('popupHistory').style.display='flex'; }
function tutupPopup(id){ document.getElementById(id).style.display='none'; }

function prosesTukar(menu, harga){
  if(coins < harga){ alert(`Koin kurang! Butuh ${harga.toLocaleString('id')} koin`); return; }
  coins -= harga;
  let now = new Date();
  let tgl = now.toLocaleDateString('id');
  let jam = now.toLocaleTimeString('id');
  let dataStruk = { tgl, jam, menu, harga, sisa: coins, nama: localStorage.kenpopNama, wa: currentWA };

  historyTukar.unshift(dataStruk);
  localStorage[getKey('historyTukar')] = JSON.stringify(historyTukar);

  fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({...dataStruk, type:"TUKAR"}) });
  tampilStruk(dataStruk);
  tutupPopup('popupTukar');
  save();
}

function tampilStruk(d){
  dataStrukTerakhir = d;
  let strukHTML = `
    <b>Tanggal:</b> ${d.tgl} ${d.jam}<br>
    <b>Nama:</b> ${d.nama}<br>
    <b>WA:</b> ${d.wa}<br>
    <b>Menu:</b> ${d.menu}<br>
    <b>Harga:</b> ${d.harga.toLocaleString('id')} Koin<br>
    <b>Sisa Koin:</b> ${d.sisa.toLocaleString('id')}<br>
    <hr><b>--- KLIK KIRIM KE ADMIN 👇 ---</b>
    <hr><b>--- TUNGGU KONFIRMASI ADMIN ---</b>
    <hr><b>--- TUNJUKKAN SS KE KASIR ---</b>
  `;
  document.getElementById('isiStruk').innerHTML = strukHTML;
  document.getElementById('popupStruk').style.display = 'flex';
}

function renderHistory(){
  let box = document.getElementById('isiHistory');
  box.innerHTML = '';
  if(historyTukar.length === 0){ box.innerHTML = '<p>Belum ada riwayat</p>'; return; }
  historyTukar.forEach(d => {
    box.innerHTML += `<div class="history-item"><b>${d.menu}</b> - ${d.harga.toLocaleString('id')} Koin<br><small>${d.tgl} ${d.jam}</small></div>`;
  });
}

function save(){
  if(!currentWA) return;
  let now = Date.now();
  if(now > autoEnd && auto > 0){ auto = 0; aAds = 0; aTimer = 0; }
  localStorage[getKey('coins')]=coins; localStorage[getKey('power')]=power; localStorage[getKey('auto')]=auto;
  localStorage[getKey('pAds')]=pAds; localStorage[getKey('aAds')]=aAds; localStorage[getKey('autoEnd')]=autoEnd;
  localStorage[getKey('pTimer')]=pTimer; localStorage[getKey('aTimer')]=aTimer; localStorage[getKey('historyTukar')]=JSON.stringify(historyTukar);
  localStorage[getKey('powerLockEnd')]=powerLockEnd; localStorage[getKey('autoLockEnd')]=autoLockEnd;
  coinsTxt.innerText = coins.toLocaleString('id');
  powerNowTxt.innerText = power;
}

async function kirimKeAdmin(){
    if(!dataStrukTerakhir) { alert('Data struk kosong'); return; }
    const data = {
        nama: dataStrukTerakhir.nama,
        wa: dataStrukTerakhir.wa,
        menu: dataStrukTerakhir.menu,
        harga: dataStrukTerakhir.harga,
        tgl: dataStrukTerakhir.tgl,
        jam: dataStrukTerakhir.jam
    };
    try {
        const response = await fetch('/api/kirim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const res = await response.json();
        if(res.status == true){
            alert('✅ Struk berhasil dikirim ke Admin');
        } else {
            alert('❌ Gagal kirim: ' + (res.reason || 'Cek server'));
        }
    } catch(err) {
        alert('Error: ' + err);
    }
}
