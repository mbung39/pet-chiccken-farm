<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💸 MONEY TAP SULTAN 💸</title>

<script type="module">
  // 1. IMPORT FIREBASE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 2. CONFIG PUNYA LU
  const firebaseConfig = {
    apiKey: "AIzaSyC0nYhsMgueVA_91JWw-m8pXWRIZiizzG4",
    authDomain: "tapkoin-sultan.firebaseapp.com",
    projectId: "tapkoin-sultan",
    storageBucket: "tapkoin-sultan.firebasestorage.app",
    messagingSenderId: "520240440983",
    appId: "1:520240440983:web:92549e6ee3beb156bcebd2",
    measurementId: "G-K1BCH7T45J"
  };

  // 3. INIT FIREBASE
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 4. FUNGSI GLOBAL BUAT SIMPAN & AMBIL DATA
  window.simpanKeFirebase = async function(userId, jumlahKoin) {
    try {
      await setDoc(doc(db, "players", userId), {
        koin: jumlahKoin,
        lastUpdate: new Date()
      });
      console.log("✅ Tersimpan ke Firebase:", jumlahKoin)
    } catch(e) {
      console.log("❌ Gagal simpan:", e)
    }
  }

  window.ambilDariFirebase = async function(userId) {
    try {
      const docSnap = await getDoc(doc(db, "players", userId));
      if (docSnap.exists()) {
        return docSnap.data().koin;
      }
      return 0;
    } catch(e) {
      console.log("❌ Gagal ambil:", e)
      return 0;
    }
  }
</script>

<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{
  background:linear-gradient(135deg, #001a00 0%, #003300 100%);
  color:white; text-align:center; font-family:Arial;
  margin:0; padding:15px; overflow-x:hidden;
}
h1{color:gold; text-shadow:0 0 10px gold; margin:5px; font-size:20px;}
#koin{
  font-size:28px; background:#000; padding:10px 20px;
  border:3px solid gold; border-radius:20px;
  display:inline-block; margin:10px; color:gold;
  box-shadow:0 0 20px gold; z-index:10; position:relative;
}
#tap{
  width:170px; height:170px;
  background:#000;
  border-radius:50%;
  border:7px solid gold;
  font-size:70px; margin:15px;
  box-shadow: 0 0 40px gold, inset 0 0 25px rgba(255,215,0,0.3);
  position:relative; z-index:10;
  transition: all 0.2s;
}
#tap:active{transform:scale(0.88);}
#tap.auto{box-shadow: 0 0 50px lime, inset 0 0 25px rgba(0,255,0,0.3); border-color:lime;}
.btn-group{display:flex; justify-content:center; gap:10px; margin:10px 0; z-index:10; position:relative;}
.btn-menu{flex:1; max-width:160px; padding:12px 10px; background:gold; color:#000; border:0; border-radius:12px; font-weight:bold; font-size:14px;}
.popup{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99; justify-content:center; align-items:center;}
.box{background:#001a00; border:3px solid gold; padding:20px; width:90%; max-width:400px; border-radius:15px;}
.item{display:flex; justify-content:space-between; align-items:center; background:#000; padding:12px; margin:8px 0; border-radius:8px; border:1px solid gold; font-size:14px;}
.btn-tukar{background:gold; color:#000; border:0; padding:8px 12px; border-radius:8px; font-weight:bold; font-size:12px;}
.iklan-box{width:100%; max-width:320px; height:100px; background:#000; border:2px dashed gold; border-radius:10px; margin:15px auto 10px; display:flex; justify-content:center; align-items:center; color:gold; font-size:12px; z-index:10; position:relative;}
.iklan-box2{width:100%; max-width:360px; height:50px; background:#000; border:2px dashed lime; border-radius:10px; margin:10px auto 15px; display:flex; justify-content:center; align-items:center; color:lime; font-size:11px; z-index:10; position:relative;}
#btnAuto{width:90%; max-width:320px; padding:16px; font-size:17px; font-weight:bold; border:0; border-radius:12px; background:linear-gradient(45deg, #00ff00, #00aa00); color:#000; animation: kedip 1.5s infinite; z-index:10; position:relative;}
#btnAuto.aktif{background:#002200; color:lime; animation:none; border:2px solid lime; box-shadow:0 0 15px lime;}
.money{position:fixed; font-size:26px; animation:muncrat 0.8s; pointer-events:none; z-index:999;}
@keyframes muncrat{0%{opacity:1; transform:scale(0.5) rotate(0deg);} 100%{opacity:0; transform:translateY(-120px) scale(1.4) rotate(360deg);}}
.uang-terbang{position:fixed; font-size:28px; bottom:-60px; animation: naikTurun 4s ease-in-out infinite; pointer-events:none; z-index:1; filter: drop-shadow(0 0 10px gold); opacity:0.6;}
@keyframes naikTurun {0% { transform: translateY(0) rotate(0deg); opacity:0; } 15% { opacity:0.7; } 50% { transform: translateY(-300px) rotate(180deg); } 85% { opacity:0.7; } 100% { transform: translateY(-600px) rotate(360deg); opacity:0; }}
@keyframes kedip{0%,100%{opacity:1;} 50%{opacity:0.7;}}
</style>
</head>
<body>

<div class="uang-terbang" style="left:10%; animation-delay:0s;">💸</div>
<div class="uang-terbang" style="left:25%; animation-delay:1s;">💵</div>
<div class="uang-terbang" style="left:40%; animation-delay:2s;">🪙</div>
<div class="uang-terbang" style="left:60%; animation-delay:0.5s;">💸</div>
<div class="uang-terbang" style="left:75%; animation-delay:1.5s;">💵</div>
<div class="uang-terbang" style="left:90%; animation-delay:2.5s;">🪙</div>

<h1>💸 MONEY TAP SULTAN 💸</h1>
<div id="koin">KOIIN: 0</div><br>
<button id="tap">💰</button><br>

<div class="btn-group">
  <button class="btn-menu" onclick="show('tukar')">TUKAR SALDO</button>
  <button class="btn-menu" onclick="show('riwayat')">RIWAYAT</button>
</div>

<div class="iklan-box">TEMPAT IKLAN 320x100</div>
<button id="btnAuto" onclick="mulaiAuto()">AKTIFKAN AUTO KLIK 1 JAM</button>
<div class="iklan-box2">TEMPAT IKLAN 360x50</div>

<div id="tukar" class="popup" onclick="hide('tukar')"><div class="box" onclick="event.stopPropagation()"><h2>💸 TUKAR SALDO 💸</h2>
<div class="item">DANA 5.000 <small>500.000 koin</small> <button class="btn-tukar" onclick="tukar('DANA 5000',500000)">TUKAR</button></div>
<div class="item">GOPAY 10.000 <small>1.000.000 koin</small> <button class="btn-tukar" onclick="tukar('GOPAY 10000',1000000)">TUKAR</button></div>
<div class="item">DANA 20.000 <small>2.000.000 koin</small> <button class="btn-tukar" onclick="tukar('DANA 20000',2000000)">TUKAR</button></div>
<button class="btn-menu" style="background:#555; color:#fff; max-width:100%;" onclick="hide('tukar')">TUTUP</button></div></div>

<div id="riwayat" class="popup" onclick="hide('riwayat')"><div class="box" onclick="event.stopPropagation()"><h2>📜 RIWAYAT WD</h2><div id="list" style="max-height:200px; overflow-y:auto; text-align:left;"></div><button class="btn-menu" style="background:#555; color:#fff; max-width:100%;" onclick="hide('riwayat')">TUTUP</button></div></div>

<div id="struk" class="popup" onclick="hide('struk')"><div class="box" onclick="event.stopPropagation()"><h2>✅ BERHASIL</h2><div id="isistruk" style="text-align:left;"></div><button class="btn-menu" style="max-width:100%;" onclick="hide('struk')">OK</button></div></div>

<script>
var userId = "player1"; // ID pemain. Nanti bisa diganti
var koin = 0;
var hist = localStorage.hist? JSON.parse(localStorage.hist) : [];
var autoInterval = null;
var autoWaktu = 0;

// LOAD DATA DARI FIREBASE PAS BUKA GAME
window.onload = async function(){
  let koinFirebase = await ambilDariFirebase(userId);
  if(koinFirebase > 0){
    koin = koinFirebase;
  } else {
    koin = localStorage.koin? parseFloat(localStorage.koin) : 0;
  }
  document.getElementById('koin').innerText = 'KOIIN: ' + formatKoin(koin);
}

function formatKoin(angka){
  return angka.toLocaleString('id-ID', {minimumFractionDigits: 1, maximumFractionDigits: 1});
}

document.getElementById('tap').onclick = klik;

if(localStorage.autoSisa){
  autoWaktu = parseInt(localStorage.autoSisa);
  if(autoWaktu > 0){ mulaiAuto(true); }
}

function klik(e){
  tambahKoinManual();
  muncratAcak();
}

async function tambahKoinManual(){
  koin = koin + 0.1;
  koin = Math.round(koin * 10) / 10;
  localStorage.koin = koin;
  document.getElementById('koin').innerText = 'KOIIN: ' + formatKoin(koin);
  await simpanKeFirebase(userId, koin); // SIMPAN KE FIREBASE
}

async function tambahKoinAuto(){
  koin = koin + 1;
  localStorage.koin = koin;
  document.getElementById('koin').innerText = 'KOIIN: ' + formatKoin(koin);
  await simpanKeFirebase(userId, koin); // SIMPAN KE FIREBASE
}

function muncratAcak(){
  var btn = document.getElementById('tap');
  var rect = btn.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  for(var i=0; i<4; i++){
    var sudut = Math.random() * 360;
    var jarak = 30 + Math.random() * 60;
    var x = cx + jarak * Math.cos(sudut * Math.PI / 180);
    var y = cy + jarak * Math.sin(sudut * Math.PI / 180);
    var m = document.createElement('div');
    m.className='money';
    m.innerHTML = ['💵','🪙','💸'][Math.floor(Math.random()*3)];
    m.style.left = x + 'px';
    m.style.top = y + 'px';
    m.style.animationDelay = i*0.08 + 's';
    document.body.appendChild(m);
    setTimeout(function(el){el.remove()},800, m);
  }
}

function mulaiAuto(load){
  if(autoInterval) return;
  if(!load){ autoWaktu = 3600; }
  document.getElementById('tap').className = 'auto';
  autoInterval = setInterval(function(){
    tambahKoinAuto();
    muncratAcak();
    autoWaktu--;
    localStorage.autoSisa = autoWaktu;
    var jam = Math.floor(autoWaktu/3600);
    var menit = Math.floor((autoWaktu%3600)/60);
    var detik = autoWaktu%60;
    document.getElementById('btnAuto').innerText = '⏰ ' + jam + 'j ' + menit + 'm ' + detik + 'd';
    document.getElementById('btnAuto').className = 'aktif';
    document.getElementById('btnAuto').disabled = true;
    if(autoWaktu <= 0){
      clearInterval(autoInterval);
      autoInterval = null;
      localStorage.removeItem('autoSisa');
      document.getElementById('btnAuto').innerText = 'AKTIFKAN AUTO KLIK 1 JAM';
      document.getElementById('btnAuto').className = '';
      document.getElementById('btnAuto').disabled = false;
      document.getElementById('tap').className = '';
    }
  }, 1000);
}

function show(id){
  if(id=='riwayat'){
    var s='';
    if(hist.length==0){s='Belum ada riwayat'}
    for(var i=0;i<hist.length;i++){s+='<div style="border-bottom:1px solid gold; padding:8px;">'+hist[i].menu+'<br><small>'+hist[i].tgl+' - '+hist[i].ewallet+'</small></div>'}
    document.getElementById('list').innerHTML=s;
  }
  document.getElementById(id).style.display='flex';
}
function hide(id){document.getElementById(id).style.display='none';}

async function tukar(menu,harga){
  if(koin<harga){alert('Koin kurang! Butuh '+formatKoin(harga)) ;return;}
  var nama=prompt('Nama Penerima:'); if(!nama)return;
  var no=prompt('No DANA/GOPAY:'); if(!no)return;
  koin=koin-harga;
  localStorage.koin=koin;
  await simpanKeFirebase(userId, koin); // SIMPAN PAS WD
  var tgl = new Date().toLocaleString('id');
  var data = {menu:menu, tgl:tgl, ewallet:no};
  hist.unshift(data);
  localStorage.hist=JSON.stringify(hist);
  document.getElementById('isistruk').innerHTML='<b>Tarik:</b> '+menu+'<br><b>Nama:</b> '+nama+'<br><b>No:</b> '+no+'<br><b>Sisa:</b> '+formatKoin(koin)+'<br><hr>Tunggu 1x24 Jam';
  hide('tukar'); show('struk');
  document.getElementById('koin').innerText = 'KOIIN: ' + formatKoin(koin);
}
</script>
</body>
</html>
