<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chicken Gotchi V6.3 FIX</title>
<style>
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
body { background: #c4f1f9; color: #1a2e05; font-family: 'Comic Sans MS', cursive; padding: 10px; margin: 0; display: flex; justify-content: center; }
.gotchi { width: 100%; max-width: 350px; background: #f0f9ff; border: 8px solid #38bdf8; border-radius: 40px; padding: 15px; box-shadow: 0 10px 0 #0284c7; }
.layar { background: #d9f99d; border: 4px solid #65a30d; border-radius: 20px; padding: 10px; height: 300px; position: relative; overflow: hidden; }
.umur { text-align: center; font-size: 14px; font-weight: bold; color: #365314; }
.level { text-align: center; font-size: 20px; font-weight: bold; color: #ca8a04; text-shadow: 1px 1px 2px white; }

.kandang { 
  position: absolute; 
  top: 90px; 
  left: 15px; 
  right: 15px; 
  bottom: 65px; 
  border: 4px solid #fb923c;
  border-radius: 10px; 
  background: transparent;
}
.pet-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; }
.pet { 
  font-size: 80px;
  transition: transform 0.3s;
}

/* ANIMASI */
@keyframes idle { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-5px);} }
@keyframes eat { 0%,100%{transform: translateY(0);} 50%{transform: translateY(10px);} }
@keyframes play { 0%,100%{transform: translateY(0) rotate(0deg);} 50%{transform: translateY(-20px) rotate(360deg);} }
@keyframes walk { 0%,25%,75%,100%{transform: translateY(0);} 50%{transform: translateY(-5px);} }

.idle-anim { animation: idle 2s infinite; }
.eat-anim { animation: eat 0.3s 3; }
.play-anim { animation: play 0.7s 2; }
.walk-anim { animation: walk 0.4s infinite; }

.xp-container { margin-top: 8px; }
.xp-text { font-size: 12px; text-align: center; font-weight: bold; color: #a16207; }
.xp-bar { width: 100%; height: 12px; background: #a3e635; border-radius: 10px; border: 2px solid #65a30d; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 0.3s; }

.timer { text-align: center; font-size: 14px; color: #dc2626; font-weight: bold; }
.status { display: flex; justify-content: space-around; font-size: 11px; position: absolute; bottom: 10px; left: 0; right: 0; }
.bar { width: 60px; height: 8px; background: #a3e635; border-radius: 5px; overflow: hidden; border: 2px solid #65a30d; }
.bar-fill { height: 100%; background: #22c55e; transition: width 0.3s; }
.progres { position: absolute; top: 45px; left: 10px; right: 10px; text-align: center; font-size: 12px; font-weight: bold; }
.tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
.btn { background: #38bdf8; color: white; border: none; padding: 15px 5px; border-radius: 15px; font-size: 11px; font-weight: bold; box-shadow: 0 4px 0 #0284c7; }
.btn:active { transform: translateY(2px); }
#notif { text-align: center; font-weight: bold; color: #dc2626; height: 20px; }
.evo-flash { animation: flash 0.5s 3; }
@keyframes flash { 0%,100%{filter: brightness(1);} 50%{filter: brightness(3);} }
</style>
</head>
<body>

<div class="gotchi">
  <div class="layar">
    <div class="umur" id="umur">Umur: 0 Hari</div>
    <div class="level" id="level"></div>
    <div class="timer" id="timer"></div>
    <div class="progres" id="progres"></div>
    
    <div class="kandang">
      <div class="pet-area">
        <div class="pet idle-anim" id="pet">🐓</div>
      </div>
    </div>
    
    <div class="xp-container" id="xp-container">
      <div class="xp-text" id="xp-text">EXP: 0/20</div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    </div>
    
    <div class="status">
      <div>🍗<div class="bar"><div class="bar-fill" id="lapar-bar"></div></div></div>
      <div>❤️<div class="bar"><div class="bar-fill" id="bahagia-bar"></div></div></div>
      <div>⚡<div class="bar"><div class="bar-fill" id="energi-bar"></div></div></div>
    </div>
  </div>
  
  <div id="notif"></div>
  
  <div class="tombol">
    <button class="btn" onclick="kasihMakan()">🍗<br>MAKAN<br>+3 EXP</button>
    <button class="btn" onclick="main()">⚽<br>MAIN<br>+2 EXP</button>
    <button class="btn" onclick="bersihin()">🧹<br>BERSIH<br>+1 EXP</button>
    <button class="btn" onclick="tidur()">💤<br>TIDUR<br>+1 EXP</button>
  </div>
</div>

<script>
if(!localStorage.chicken_gotchi_v4){
  localStorage.chicken_gotchi_v4 = JSON.stringify({
    stage:"dewasa","umur":0,"lvl":1,"xp":0,"targetXp":20,
    "lapar":100,"bahagia":100,"energi":100,"startTime":Date.now()
  });
}

let data = JSON.parse(localStorage.chicken_gotchi_v4);

function save(){
  localStorage.chicken_gotchi_v4 = JSON.stringify(data);
  render();
}

function setAnimasi(nama){
  let pet = document.getElementById('pet');
  pet.className = 'pet ' + nama;
}

function render(){
  document.getElementById('lapar-bar').style.width = data.lapar + '%';
  document.getElementById('bahagia-bar').style.width = data.bahagia + '%';
  document.getElementById('energi-bar').style.width = data.energi + '%';
  
  let scale = 1 + Math.floor(data.lvl / 10) * 0.2;
  document.getElementById('pet').style.transform = `scale(${scale})`;
  
  document.getElementById('umur').innerText = `Umur: ${data.umur} Hari`;
  document.getElementById('level').innerText = `LVL ${data.lvl}`;
  document.getElementById('progres').innerText = `XP: ${data.xp}/${data.targetXp}`;
  document.getElementById('xp-text').innerText = `EXP: ${data.xp}/${data.targetXp}`;
  let persen = (data.xp / data.targetXp) * 100;
  document.getElementById('xp-fill').style.width = persen + '%';
}

function tambahXP(jumlah){
  data.xp += jumlah;
  if(data.xp >= data.targetXp){
    data.lvl++; data.xp = 0; 
    data.targetXp = 20 + (data.lvl - 1) * 15;
    document.getElementById('pet').classList.add('evo-flash');
    setTimeout(()=> document.getElementById('pet').classList.remove('evo-flash'), 1500);
    showNotif(`🔥 NAIK KE LVL ${data.lvl}! 🔥`);
  }
}

function kasihMakan(){
  setAnimasi('eat-anim');
  setTimeout(()=> setAnimasi('idle-anim'), 1000);
  data.lapar = Math.min(100, data.lapar + 20);
  tambahXP(3);
  showNotif('+3 EXP!');
  save();
}
function main(){ 
  if(data.energi < 10) return; 
  setAnimasi('play-anim');
  setTimeout(()=> setAnimasi('idle-anim'), 1400);
  data.bahagia = Math.min(100, data.bahagia + 15); 
  data.energi -= 10; 
  tambahXP(2);
  showNotif('+2 EXP!'); 
  save(); 
}
function bersihin(){ 
  setAnimasi('walk-anim');
  setTimeout(()=> setAnimasi('idle-anim'), 2000);
  data.bahagia += 10; 
  tambahXP(1);
  showNotif('+1 EXP!'); 
  save(); 
}
function tidur(){ 
  data.energi = Math.min(100, data.energi + 30); 
  tambahXP(1);
  showNotif('Zzz +1 EXP'); 
  save(); 
}
function showNotif(teks){ document.getElementById('notif').innerText = teks; setTimeout(()=> document.getElementById('notif').innerText = '', 2000); }

// FIX UTAMA: BAR OTOMATIS TURUN TIAP 10 DETIK
setInterval(()=>{ 
  data.lapar = Math.max(0, data.lapar - 2);
  data.bahagia = Math.max(0, data.bahagia - 1);
  data.energi = Math.max(0, data.energi - 1);
  
  let hari = Math.floor((Date.now() - data.startTime) / 1000 / 60 / 60 / 24);
  if(hari > data.umur) data.umur = hari;
  save();
}, 10000);

save();
</script>
</body>
</html>
