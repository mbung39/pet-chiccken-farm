<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pet Chicken Farm V2.1</title>
<style>
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
body { background: #87ceeb; color: #1a2e05; font-family: 'Comic Sans MS', cursive; padding: 10px; margin: 0; }

#header { background: white; padding: 15px; border-radius: 20px; margin-bottom: 12px; border: 4px solid #65a30d; font-size: 22px; text-align: center; }
#koin { font-weight: bold; color: #eab308; font-size: 26px; }

.shop { background: white; padding: 15px; border-radius: 20px; margin: 12px 0; border: 4px solid #65a30d; }
.shop h3 { margin: 0 0 12px 0; text-align: center; }
.item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f7fee7; border-radius: 12px; margin: 10px 0; }
.stok { font-weight: bold; color: #65a30d; font-size: 18px; }

/* KANDANG BESAR PAKAI CSS */
.kandang-besar { 
  width: 100%; max-width: 400px; height: 320px; margin: 15px auto; position: relative;
  background: #d2b48c; /* tanah */
  border-radius: 20px; border: 6px solid #8b4513; box-shadow: 0 8px 0 #654321;
  overflow: hidden;
}
.pagar { position: absolute; width: 100%; height: 100%; background-image: 
  linear-gradient(90deg, transparent 45%, #a0522d 45%, #a0522d 55%, transparent 55%),
  linear-gradient(0deg, transparent 45%, #a0522d 45%, #a0522d 55%, transparent 55%);
  background-size: 40px 40px; border: 3px dashed white; box-sizing: border-box;
}
.palungan { position: absolute; left: 10%; top: 45%; width: 80px; height: 30px; background: #a0522d; border-radius: 10px; cursor: pointer; border: 3px solid #654321; }
.palungan::after { content: '🌽'; position: absolute; left: 25px; top: -5px; font-size: 20px; }
.gudang { position: absolute; right: 5%; top: 5%; width: 90px; height: 90px; background: #dc2626; border-radius: 10px; cursor: pointer; border: 4px solid white; display: flex; align-items: center; justify-content: center; font-size: 50px; }

/* AYAM */
.ayam { position: absolute; font-size: 35px; transition: all 1.5s linear; }
.ayam-anak { animation: jalan 2s ease-in-out infinite alternate; }
.ayam-dewasa { animation: bob 1.2s ease-in-out infinite; }
@keyframes jalan { 0%{transform: translateX(-8px);} 100%{transform: translateX(8px);} }
@keyframes bob { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-10px);} }
.telur { position: absolute; font-size: 30px; animation: goyang 0.6s infinite; }
@keyframes goyang { 0%,100%{transform: rotate(-5deg);} 50%{transform: rotate(5deg);} }

.jagung-terbang { position: absolute; font-size: 25px; animation: sebar 1s forwards; pointer-events: none; }
@keyframes sebar { from{opacity:1; transform: scale(1);} to{opacity:0; transform: translateY(50px) scale(0.5);} }

button { background: #65a30d; color: white; border: none; padding: 12px 18px; border-radius: 12px; font-weight: bold; box-shadow: 0 3px 0 #4d7c0f; }
#notif { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 12px 25px; border-radius: 15px; display: none; z-index: 100; }
</style>
</head>
<body>

<div id="header">💰 KOIN: <span id="koin">500</span></div>

<div class="shop">
  <h3>🛒 GUDANG / TOKO</h3>
  <div class="item"><span>🥚 Telur Ayam</span><span class="stok" id="stok-telur">x0</span><button onclick="beliTelur(100)">BELI 100</button></div>
  <div class="item"><span>🌽 Pakan Jagung</span><span class="stok" id="stok-jagung">x0</span><button onclick="beliPakan('jagung', 50)">BELI 50</button></div>
  <div class="item"><span>🌽🌽 Jagung Super</span><span class="stok" id="stok-super">x0</span><button onclick="beliPakan('super', 200)">BELI 200</button></div>
</div>

<h3 style="text-align:center;">🏠 KANDANG BESAR</h3>
<div class="kandang-besar" id="kandang">
  <div class="pagar"></div>
  <div class="palungan" onclick="sebarPakan()" title="Klik buat kasih makan"></div>
  <div class="gudang" onclick="showShop()" title="Buka Gudang">🏠</div>
</div>

<div id="notif"></div>

<script>
let koin = +localStorage.farm_koin || 500;
let inventory = JSON.parse(localStorage.farm_inv || '{"telur":0,"jagung":0,"super":0}');
let ayamList = JSON.parse(localStorage.farm_ayam || '[]');

const WAKTU_TETAS = 10000;
const WAKTU_DEWASA = 30000;

function save(){
  localStorage.farm_koin = koin; 
  localStorage.farm_inv = JSON.stringify(inventory);
  localStorage.farm_ayam = JSON.stringify(ayamList);
  document.getElementById('koin').innerText = koin.toLocaleString('id');
  document.getElementById('stok-telur').innerText = 'x' + inventory.telur;
  document.getElementById('stok-jagung').innerText = 'x' + inventory.jagung;
  document.getElementById('stok-super').innerText = 'x' + inventory.super;
  renderAyam();
}

function beliTelur(harga){ if(koin < harga) return showNotif('❌ Koin kurang!'); koin -= harga; inventory.telur++; showNotif('🥚 Telur dibeli!'); taruhTelur(); save(); }
function beliPakan(jenis, harga){ if(koin < harga) return showNotif('❌ Koin kurang!'); koin -= harga; inventory[jenis]++; showNotif(`🌽 Pakan ${jenis} dibeli!`); save(); }
function showShop(){ document.querySelector('.shop').scrollIntoView(); }

function taruhTelur(){
  if(inventory.telur <= 0) return;
  inventory.telur--;
  ayamList.push({ x: Math.random()*70 + 15, y: Math.random()*50 + 35, stage: 'telur', start: Date.now(), boost: 1 });
}

function sebarPakan(){
  let jenis = inventory.super > 0? 'super' : inventory.jagung > 0? 'jagung' : null;
  if(!jenis) return showNotif('❌ Pakan Habis! Beli di Toko');
  
  inventory[jenis]--;
  ayamList.forEach(a => { if(a.stage === 'anak'){ a.boost = jenis === 'super'? 3 : 1; a.start = Date.now(); } });
  
  let kandang = document.getElementById('kandang');
  for(let i=0; i<10; i++){
    let j = document.createElement('div'); j.className = 'jagung-terbang'; j.innerText = '🌽';
    j.style.left = Math.random()*80 + 10 + '%'; j.style.top = '40%';
    kandang.appendChild(j); setTimeout(()=>j.remove(), 1000);
  }
  showNotif(jenis === 'super'? '✨ Pakan Super disebar!' : '😋 Pakan disebar!');
  save();
}

function jualAyam(index){
  let bonus = ayamList[index].boost === 3? 500 : 200;
  koin += bonus; ayamList.splice(index, 1);
  showNotif(`💰 Ayam dijual +${bonus} koin!`);
  save();
}

function renderAyam(){
  let kandang = document.getElementById('kandang');
  kandang.querySelectorAll('.ayam,.telur').forEach(el => el.remove());
  
  ayamList.forEach((a, i) => {
    let now = Date.now(); let elapsed = now - a.start;
    if(a.stage === 'telur' && elapsed > WAKTU_TETAS){ a.stage = 'anak'; a.start = now; }
    else if(a.stage === 'anak' && elapsed > WAKTU_DEWASA / a.boost){ a.stage = 'dewasa'; }
    
    let el = document.createElement('div');
    el.style.left = a.x + '%'; el.style.top = a.y + '%';
    
    if(a.stage === 'telur'){
      el.className = 'telur'; el.innerText = '🥚';
    } else {
      el.className = 'ayam ' + (a.stage === 'anak'? 'ayam-anak' : 'ayam-dewasa');
      el.innerText = a.stage === 'anak'? '🐤' : '🐔';
      if(a.stage === 'dewasa') el.onclick = () => jualAyam(i);
    }
    kandang.appendChild(el);
  });
}

function showNotif(teks){ let n = document.getElementById('notif'); n.innerText = teks; n.style.display = 'block'; setTimeout(()=> n.style.display = 'none', 1800); }
setInterval(save, 1000); save();
</script>
</body>
</html>
