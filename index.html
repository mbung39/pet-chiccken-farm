<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayam Jago V6.2</title>
<style>
body{background:#c4f1f9;font-family:'Comic Sans MS',cursive;display:flex;justify-content:center;padding:10px}
.gotchi{width:100%;max-width:350px;background:#f0f9ff;border:8px solid #38bdf8;border-radius:40px;padding:15px}
.layar{background:#d9f99d;border:4px solid #65a30d;border-radius:20px;padding:10px;height:300px;position:relative}
.kandang{position:absolute;top:90px;left:15px;right:15px;bottom:65px;border:4px solid #fb923c;border-radius:10px}
.pet-area{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center}
.pet-container{position:relative;width:130px;height:130px;animation:idle 2s infinite}
.pet-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(3px 3px 5px rgba(0,0,0,0.3))}
.svg-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes eat{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes play{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(360deg)}}
.eat-anim{animation:eat.3s 3}.play-anim{animation:play.7s 2}
.xp-bar{width:100%;height:12px;background:#a3e635;border-radius:10px;border:2px solid #65a30d;overflow:hidden}
.xp-fill{height:100%;background:#fbbf24;transition:width.3s}
.tombol{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.btn{background:#38bdf8;color:white;border:none;padding:15px 5px;border-radius:15px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<div class="gotchi">
  <div class="layar">
    <div style="text-align:center;font-weight:bold" id="umur">Umur: 0 Hari</div>
    <div style="text-align:center;font-size:18px;color:#ca8a04" id="level"></div>
    <div style="text-align:center;font-size:12px" id="progres"></div>
    <div class="kandang">
      <div class="pet-area">
        <div class="pet-container" id="pet-container">
          <img class="pet-img" id="pet-img" src="https://i.ibb.co/LpYbG0k/rooster.png">
          <svg class="svg-overlay" viewBox="0 0 100 100">
            <circle class="eye" cx="45" cy="32" r="3" fill="black"/>
            <circle class="eye" cx="55" cy="32" r="3" fill="black"/>
            <path class="beak" d="M48 38 L52 38 L50 42 Z" fill="orange"/>
          </svg>
        </div>
      </div>
    </div>
    <div id="xp-container" style="display:none;margin-top:8px">
      <div id="xp-text" style="text-align:center;font-size:12px;font-weight:bold">EXP: 0/20</div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    </div>
    <div style="display:flex;justify-content:space-around;position:absolute;bottom:10px;left:0;right:0;font-size:11px">
      <div>🍗<div style="width:50px;height:8px;background:#a3e635;border-radius:5px"><div id="lapar-bar" style="height:100%;background:#22c55e;width:100%"></div></div></div>
      <div>❤️<div style="width:50px;height:8px;background:#a3e635;border-radius:5px"><div id="bahagia-bar" style="height:100%;background:#22c55e;width:100%"></div></div></div>
      <div>⚡<div style="width:50px;height:8px;background:#a3e635;border-radius:5px"><div id="energi-bar" style="height:100%;background:#22c55e;width:100%"></div></div></div>
    </div>
  </div>
  <div id="notif" style="text-align:center;font-weight:bold;color:#dc2626;height:20px"></div>
  <div class="tombol">
    <button class="btn" onclick="kasihMakan()">🍗<br>MAKAN<br>+3 EXP</button>
    <button class="btn" onclick="main()">⚽<br>MAIN<br>+2 EXP</button>
    <button class="btn" onclick="bersihin()">🧹<br>BERSIH<br>+1 EXP</button>
    <button class="btn" onclick="tidur()">💤<br>TIDUR<br>+1 EXP</button>
  </div>
</div>
<script>
let data=JSON.parse(localStorage.chicken_gotchi_v4||'{"stage":"dewasa","umur":0,"lvl":1,"xp":0,"pakanCount":0,"targetXp":20,"lapar":100,"bahagia":100,"energi":100,"startTime":Date.now()}');
function save(){localStorage.chicken_gotchi_v4=JSON.stringify(data);render()}
function setAnimasi(n){let p=document.getElementById('pet-container');p.className='pet-container '+n}
function render(){
  ['lapar','bahagia','energi'].forEach(s=>document.getElementById(s+'-bar').style.width=data[s]+'%');
  if(data.stage==='dewasa'){
    document.getElementById('level').innerText=`LVL ${data.lvl}`;
    document.getElementById('progres').innerText=`XP: ${data.xp}/${data.targetXp}`;
    document.getElementById('xp-container').style.display='block';
    document.getElementById('xp-text').innerText=`EXP: ${data.xp}/${data.targetXp}`;
    document.getElementById('xp-fill').style.width=(data.xp/data.targetXp)*100+'%';
  }
  document.getElementById('umur').innerText=`Umur: ${data.umur} Hari`;
}
function tambahXP(j){if(data.stage==='dewasa'){data.xp+=j;if(data.xp>=data.targetXp){data.lvl++;data.xp=0;data.targetXp=20+(data.lvl-1)*15;showNotif(`🎉 LVL ${data.lvl}!`)}}}
function kasihMakan(){setAnimasi('eat-anim');setTimeout(()=>setAnimasi(''),1000);data.lapar=Math.min(100,data.lapar+20);tambahXP(3);showNotif('+3 EXP!');save()}
function main(){if(data.energi<10)return;setAnimasi('play-anim');setTimeout(()=>setAnimasi(''),1400);data.bahagia=Math.min(100,data.bahagia+15);data.energi-=10;tambahXP(2);showNotif('+2 EXP!');save()}
function bersihin(){data.bahagia+=10;tambahXP(1);showNotif('+1 EXP!');save()}
function tidur(){data.energi=Math.min(100,data.energi+30);tambahXP(1);showNotif('Zzz +1 EXP');save()}
function showNotif(t){document.getElementById('notif').innerText=t;setTimeout(()=>document.getElementById('notif').innerText='',2000)}
setInterval(()=>{let h=Math.floor((Date.now()-data.startTime)/1000/60/60/24);if(h>data.umur)data.umur=h;save()},5000);save();
</script>
</body>
</html>
