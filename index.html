<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 Aquarium Sultan</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#0f1f2a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;font-family:sans-serif}
h2{color:#fff;margin-bottom:12px;letter-spacing:2px;text-shadow:0 2px 10px #00e5ff}

/* AQUARIUM SULTAN */
.aquarium{
  width:100%;max-width:420px;height:520px;position:relative;
  background:linear-gradient(180deg,#c8f0ff 0%,#7ed0ff 25%,#4aa8d8 60%,#2a7aa8 100%);
  border:6px solid #e6f7ff;border-radius:24px 24px 16px 16px;
  box-shadow:
    inset 0 0 40px rgba(255,255,255,0.9),
    inset 0 -40px 40px rgba(0,0,0,0.25),
    inset 10px 0 20px rgba(255,255,255,0.4),
    0 20px 40px rgba(0,0,0,0.6);
  overflow:hidden
}
/* PANTULAN KACA KIRI */
.aquarium::before{
  content:'';position:absolute;top:0;left:8%;width:28%;height:100%;
  background:linear-gradient(90deg,rgba(255,255,255,0.6),rgba(255,255,255,0));
  transform:skewX(-12deg);z-index:10;pointer-events:none
}
/* PASIR + BATU */
.sand{
  position:absolute;bottom:0;width:100%;height:70px;
  background:radial-gradient(ellipse at top,#fff7d6 0%,#e6d0a0 20%,#c4a46a 60%,#8a6a3a 100%);
  z-index:2;border-radius:0 0 10px 10px
}
.rocks{position:absolute;bottom:55px;left:20px;font-size:26px;z-index:3;filter:drop-shadow(0 2px 2px #0005)}
.rocks2{position:absolute;bottom:50px;right:30px;font-size:22px;z-index:3}

/* TANAMAN GOYANG */
.plant{position:absolute;bottom:60px;font-size:48px;z-index:2;transform-origin:bottom;animation:sway 3s infinite ease-in-out}
.plant1{left:12px;animation-delay:0s}
.plant2{right:15px;font-size:52px;animation-delay:0.8s;transform:scaleX(-1)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* GELEMBUNG BANYAK */
.bubble{
  position:absolute;width:8px;height:8px;
  background:radial-gradient(circle at 30% 30%,#fff,#a0e0ff 60%,transparent);
  border-radius:50%;bottom:70px;animation:bubble 4s infinite linear;
  box-shadow:0 0 6px #fff8
}
@keyframes bubble{0%{transform:translateY(0) translateX(0);opacity:0.9}100%{transform:translateY(-420px) translateX(15px);opacity:0}}

/* IKAN SULTAN */
.fish{
  position:absolute;width:160px;height:160px;object-fit:contain;
  top:38%;left:30%;z-index:4;
  animation:swim 4s infinite alternate ease-in-out;
  filter:drop-shadow(0 4px 8px #0006);
  cursor:pointer
}
@keyframes swim{
  0%{transform:translateX(0) translateY(0) rotate(-4deg) scaleX(1)}
  50%{transform:translateX(60px) translateY(-20px) rotate(3deg) scaleX(1)}
  100%{transform:translateX(20px) translateY(10px) rotate(-2deg) scaleX(-1)}
}

/* CAHAYA ATAS */
.light{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:80%;height:30px;background:radial-gradient(ellipse,#fff8,transparent 70%);z-index:11;filter:blur(4px)}

/* KONTROL */
.controls{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:3px solid #fff;border-radius:20px;padding:10px 18px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0005}
.feed{background:#2ecc71}.clean{background:#3498db}.tap{background:#f1c40f;color:#5a3a00}
.tag{margin-top:10px;background:#fde8c0;border:2px solid #fff;border-radius:20px;padding:6px 16px;font-weight:800;color:#5d3a1a}
</style>
</head>
<body>
<h2>🐟 BETTA SULTAN TANK 🐟</h2>

<div class="aquarium" id="tank">
  <div class="light"></div>
  <div class="plant plant1">🌿</div>
  <div class="plant plant2">🌿</div>
  <div class="rocks">🪨🐚</div>
  <div class="rocks2">🪨</div>
  <div class="bubble" style="left:18%;animation-delay:0s;width:7px;height:7px"></div>
  <div class="bubble" style="left:35%;animation-delay:0.5s;width:10px;height:10px"></div>
  <div class="bubble" style="left:55%;animation-delay:1.2s"></div>
  <div class="bubble" style="left:72%;animation-delay:0.2s;width:6px;height:6px"></div>
  <div class="bubble" style="left:85%;animation-delay:1.8s"></div>
  <img class="fish" id="fish" src="fish_0.png" onclick="this.style.transform='scale(1.5) rotate(360deg)';setTimeout(()=>this.style.transform='',600)">
  <div class="sand"></div>
</div>

<div class="tag" id="name">Ruby - Happy • Tap ikan buat loncat!</div>

<div class="controls">
  <button class="btn feed" onclick="feed()">🥣 Feed</button>
  <button class="btn clean" onclick="clean()">💧 Bersihin</button>
  <button class="btn tap" onclick="nextFish()">🔄 Ganti Ikan</button>
</div>

<script>
let idx=0;
const names=['Ruby Happy','Aqua Hungry','Violet Happy','Sunny Sleepy','Lemon Happy','Tide Happy','Rosy Hungry','Moss Happy','Cosmo Happy','Pearl Happy'];
function nextFish(){
  idx=(idx+1)%10;
  document.getElementById('fish').src=`fish_${idx}.png`;
  document.getElementById('name').innerText=names[idx]+' • Tap ikan buat loncat!';
}
function feed(){
  let f=document.getElementById('fish');
  f.style.filter='drop-shadow(0 0 20px gold)';
  document.getElementById('name').innerText='Yummy! Happy! ✨';
  setTimeout(()=>{f.style.filter='drop-shadow(0 4px 8px #0006)';},1000);
}
function clean(){
  document.getElementById('tank').style.filter='brightness(1.3)';
  setTimeout(()=>document.getElementById('tank').style.filter='',600);
}
</script>
</body>
</html>
