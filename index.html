<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chicken Gotchi V4.5</title>
<style>
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
body { background: #c4f1f9; color: #1a2e05; font-family: 'Comic Sans MS', cursive; padding: 10px; margin: 0; display: flex; justify-content: center; }
.gotchi { width: 100%; max-width: 350px; background: #f0f9ff; border: 8px solid #38bdf8; border-radius: 40px; padding: 15px; box-shadow: 0 10px 0 #0284c7; }
.layar { background: #d9f99d; border: 4px solid #65a30d; border-radius: 20px; padding: 10px; height: 300px; position: relative; overflow: hidden; }
.umur { text-align: center; font-size: 14px; font-weight: bold; color: #365314; }
.level { text-align: center; font-size: 18px; font-weight: bold; color: #ca8a04; text-shadow: 1px 1px 2px white; }

/* KANDANG BARU */
.kandang { 
  position: absolute; 
  top: 90px; 
  left: 15px; 
  right: 15px; 
  bottom: 65px; 
  border: 4px solid #fb923c; /* GARIS ORANGE */
  border-radius: 10px; 
  background: rgba(251, 146, 60, 0.1); /* TRANSPARAN DIKIT */
}
.pet-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.pet { 
  font-size: 70px; 
  position: absolute; 
  bottom: 5px; 
  transition: all 0.5s ease; /* JALAN LEBIH HALUS */
}

.xp-container { margin-top: 8px; }
.xp-text { font-size: 12px; text-align: center; font-weight: bold; color: #a16207; }
.xp-bar { width: 100%; height: 12px; background: #a3e635; border-radius: 10px; border: 2px solid #65a30d; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 0.3s; }

.timer { text-align: center; font-size: 14px; color: #dc2626; font-weight: bold; }
.status { display: flex; justify-content: space-around; font-size: 11px; position: absolute; bottom: 10px; left: 0; right: 0; }
.bar { width: 50px; height: 8px; background: #a3e635; border-radius: 5px; overflow: hidden; border: 2px solid #65a30d; }
.bar-fill { height: 100%; background: #22c55e; transition: width 0.3s; }
.progres { position: absolute; top: 45px; left: 10px; right: 10px; text-align: center; font-size: 12px; font-weight: bold; }
.tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
.btn { background: #38bdf8; color: white; border: none; padding: 15px 5px; border-radius: 15px; font-size: 11px; font-weight: bold; box-shadow: 0 4px 0 #0284c7; }
.btn:active { transform: translateY(2px); }
#notif { text-align: center; font-weight: bold; color: #dc2626; height: 20px; }
</style>
</head>
<body>

<div class="gotchi">
  <div class="layar">
    <div class="umur" id="umur">Umur: 0 Hari</div>
    <div class="level" id="level"></div>
    <div class="timer" id="timer"></div>
    <div class="progres" id="progres"></div>
    
    <!-- KANDANG -->
    <div class="kandang">
      <div class="pet-area">
        <span class="pet" id="pet">🥚</span>
      </div>
    </div>
    
    <div class="xp-container" id="xp-container" style="display:none;">
      <div class="xp-text" id="xp-text">EXP: 0/300</div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    </div>
    
    <div class="status">
      <div>🍗<div class="bar"><div class="bar-fill" id="lapar-bar"></div></div></div>
      <div>❤️<div class="bar"><div class="bar-fill" id="bahagia-bar"></div></div></div>
      <div>⚡<div class="bar"><div class="bar-fill" id="energi-bar"></div></div></div>
    </div>
  </div>
  
  <div id="notif"></div>
  
  <div class="tombol">
    <button class="btn" onclick="kasihMakan()">🍗<br>MAKAN</button>
    <button class="btn" onclick="main()">⚽<br>MAIN</button>
    <button class="btn" onclick="bersihin()">🧹<br>BERSIH</button>
    <button class="btn" onclick="tidur()">💤<br>TIDUR</button>
  </div>
</div>

<script>
if(!localStorage.chicken_gotchi_v4){
  localStorage.chicken_gotchi_v4 = JSON.stringify({
    stage:"telur","umur":0,"lvl":1,"xp":0,"pakanCount":0,"targetXp":10,
    "lapar":100,"bahagia":100,"energi":100,"startTime":Date.now(),"posX":50,"posY":80
  });
}

let data = JSON.parse(localStorage.chicken_gotchi_v4);

function save(){
  localStorage.chicken_gotchi_v4 = JSON.stringify(data);
  render();
}

function render(){
  document.getElementById('lapar-bar').style.width = data.lapar + '%';
  document.getElementById('bahagia-bar').style.width = data.bahagia + '%';
  document.getElementById('energi-bar').style.width = data.energi + '%';
  
  let emoji = '🥚';
  if(data.stage === 'bayi') emoji = '🐤';
  if(data.stage === 'remaja') emoji = '🐥';
  if(data.stage === 'dewasa') emoji = '🐔';
  
  let petEl = document.getElementById('pet');
  petEl.innerText = emoji;
  petEl.style.left = data.posX + '%';
  petEl.style.bottom = data.posY + '%';
  
  document.getElementById('umur').innerText = `Umur: ${data.umur} Hari`;
  
  if(data.stage === 'telur'){
    let sisa = 10 - Math.floor((Date.now() - data.startTime) / 1000);
    document.getElementById('timer').innerText = sisa > 0 ? `Netas dalam: ${sisa} detik` : '';
  } else {
    document.getElementById('timer').innerText = '';
  }
  
  if(data.stage === 'dewasa'){
    document.getElementById('level').innerText = `LVL ${data.lvl}`;
    document.getElementById('progres').innerText = `XP: ${data.xp}/${data.targetXp} Pakan`;
    document.getElementById('xp-container').style.display = 'block';
    document.getElementById('xp-text').innerText = `EXP: ${data.xp}/${data.targetXp}`;
    let persen = (data.xp / data.targetXp) * 100;
    document.getElementById('xp-fill').style.width = persen + '%';
  } else {
    document.getElementById('level').innerText = '';
    document.getElementById('progres').innerText = `Progress: ${data.pakanCount}/${data.targetXp} Pakan`;
    document.getElementById('xp-container').style.display = 'none';
  }
}

function jalanAcak(){
  if(data.stage !== 'telur'){
    // JALAN RANDOM DI DALAM KANDANG 10% - 90%
    data.posX += (Math.random() - 0.5) * 15;
    data.posY += (Math.random() - 0.5) * 10;
    
    // LOCK BIAR GA KELUAR KANDANG
    data.posX = Math.max(10, Math.min(90, data.posX));
    data.posY = Math.max(5, Math.min(80, data.posY));
  }
}

function cekEvolusi(){
  let elapsed = (Date.now() - data.startTime) / 1000;
  
  if(data.stage === 'telur' && elapsed >= 10){
    data.stage = 'bayi'; data.targetXp = 50; data.pakanCount = 0;
    showNotif('🎉 SELAMAT! TELUR NETAS JADI ANAK AYAM!');
  }
  else if(data.stage === 'bayi' && data.pakanCount >= 50){
    data.stage = 'remaja'; data.targetXp = 150; data.pakanCount = 0;
    showNotif('🎉 NAIK LEVEL! JADI AYAM REMAJA!');
  }
  else if(data.stage === 'remaja' && data.pakanCount >= 150){
    data.stage = 'dewasa'; data.xp = 0; data.targetXp = 200;
    showNotif('🎉 NAIK LEVEL! JADI AYAM DEWASA LVL 1!');
  }
  else if(data.stage === 'dewasa' && data.xp >= data.targetXp){
    data.lvl++; data.xp = 0; 
    data.targetXp = 200 + (data.lvl - 1) * 50;
    showNotif(`🎉 CONGRATS! NAIK KE LVL ${data.lvl}!`);
  }
}

function kasihMakan(){
  if(data.stage === 'mati') return;
  data.lapar = Math.min(100, data.lapar + 20);
  data.pakanCount++;
  if(data.stage === 'dewasa') data.xp++;
  jalanAcak();
  cekEvolusi();
  showNotif('+1 Pakan!');
  save();
}
function main(){ if(data.energi < 10) return; data.bahagia = Math.min(100, data.bahagia + 15); data.energi -= 10; jalanAcak(); showNotif('Asik main!'); save(); }
function bersihin(){ data.bahagia += 10; jalanAcak(); showNotif('Bersih!'); save(); }
function tidur(){ data.energi = Math.min(100, data.energi + 30); showNotif('Zzz...'); save(); }
function showNotif(teks){ document.getElementById('notif').innerText = teks; setTimeout(()=> document.getElementById('notif').innerText = '', 2000); }

setInterval(()=>{ 
  cekEvolusi();
  jalanAcak();
  let hari = Math.floor((Date.now() - data.startTime) / 1000 / 60 / 60 / 24);
  if(hari > data.umur) data.umur = hari;
  save();
}, 2000);

save();
</script>
</body>
</html>
