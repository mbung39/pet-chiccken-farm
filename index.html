<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Juragan Kosan PRO - Gresik</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#111;font-family:system-ui;color:white;overflow:hidden}
#top{background:#222;padding:12px;display:flex;justify-content:space-between}
#money{color:#ffd700;font-weight:900}
#room{width:100vw;height:60vh;background:#d9c5a0;position:relative;overflow:hidden;border:4px solid #8b6f47}
#floor{position:absolute;bottom:0;width:100%;height:75%;background:linear-gradient(#e8dcc5,#c9b896);transform:perspective(500px) rotateX(25deg);transform-origin:bottom}
.tile{position:absolute;width:60px;height:60px;border:1px solid rgba(0,0,0,0.1);background-size:cover}
.furn{position:absolute;font-size:40px;z-index:10;transition:0.2s}
.selected{filter:drop-shadow(0 0 10px gold);transform:scale(1.2)}
#shop{background:#1e1e1e;position:absolute;bottom:0;width:100%;padding:12px;border-radius:20px 20px 0 0;max-height:38vh;overflow-y:auto}
.item{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;margin:6px 0;padding:12px;border-radius:12px}
.item b{font-size:14px}
.btn{padding:8px 14px;border:none;border-radius:10px;background:#00d26a;color:white;font-weight:bold}
.btn:disabled{background:#555}
</style>
</head><body>
<div id="top"><div>🏠 JURAGAN KOSAN PRO</div><div id="money">💰 Rp 1.000.000</div></div>
<div id="room">
<div id="floor"></div>
<div style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px;font-size:12px">👆 TAP LANTAI BUAT NARO FURNITURE</div>
</div>
<div id="shop">
<div style="display:flex;justify-content:space-between"><b>🛒 TAMBAHKAN FURNITURE</b><span style="font-size:12px;opacity:0.6">Pilih dulu, baru tap lantai</span></div>
<div class="item"><div><b>🛏️ Kasur Single</b><br><small style="opacity:0.6">Nyaman, penyewa betah</small></div><button class="btn" onclick="pick('🛏️',150000)">150k</button></div>
<div class="item"><div><b>📺 TV LED 32"</b><br><small style="opacity:0.6">+100k sewa / hari</small></div><button class="btn" onclick="pick('📺',250000)">250k</button></div>
<div class="item"><div><b>🪑 Meja Belajar</b><br><small style="opacity:0.6">Anak kos rajin</small></div><button class="btn" onclick="pick('🪑',100000)">100k</button></div>
<div class="item"><div><b>🚽 Kamar Mandi Dalam</b><br><small style="opacity:0.6">Kosan elite auto laku</small></div><button class="btn" onclick="pick('🚽',400000)">400k</button></div>
<div class="item"><div><b>❄️ AC Dingin</b><br><small style="opacity:0.6">+200k sewa</small></div><button class="btn" onclick="pick('❄️',500000)">500k</button></div>
</div>
<script>
let uang=1000000, selected=null;
let room=document.getElementById('room');
function pick(emoji,harga){
 if(uang<harga){alert('Uang kurang bree! Tagih kos dulu');return}
 selected=emoji;
 alert('Udah milih '+emoji+' bree! Sekarang TAP LANTAI kamar buat naroh!');
}
room.addEventListener('click',(e)=>{
 if(!selected)return;
 let furn=document.createElement('div');
 furn.className='furn'; furn.innerText=selected;
 furn.style.left=(e.clientX-25)+'px';
 furn.style.top=(e.clientY-80)+'px';
 furn.onclick=(ev)=>{ev.stopPropagation(); if(confirm('Jual furniture ini?')){furn.remove(); uang+=50000; upd()}};
 room.appendChild(furn);
 uang-=100000; selected=null; upd();
})
function upd(){document.getElementById('money').innerText='💰 Rp '+uang.toLocaleString('id-ID')}
setInterval(()=>{let count=document.querySelectorAll('.furn').length; if(count>0){uang+=count*2000; upd()}},1000);
</script>
</body></html>
