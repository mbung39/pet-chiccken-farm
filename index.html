<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chicken Gotchi V3.0</title>
<style>
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
body { background: #c4f1f9; color: #1a2e05; font-family: 'Comic Sans MS', cursive; padding: 10px; margin: 0; display: flex; justify-content: center; }

.gotchi { width: 100%; max-width: 350px; background: #f0f9ff; border: 8px solid #38bdf8; border-radius: 40px; padding: 15px; box-shadow: 0 10px 0 #0284c7; }

.layar { background: #d9f99d; border: 4px solid #65a30d; border-radius: 20px; padding: 10px; height: 280px; position: relative; overflow: hidden; }

.status { display: flex; justify-content: space-around; font-size: 12px; margin-bottom: 8px; }
.bar { width: 60px; height: 8px; background: #ddd; border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: #22c55e; transition: width 0.5s; }

.pet-area { text-align: center; height: 160px; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 70px; }
.pet { animation: bob 1.5s infinite; }
@keyframes bob { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-10px);} }
.pet.sedih { animation: goyang 0.3s infinite; }
@keyframes goyang { 0%,100%{transform: rotate(-5deg);} 50%{transform: rotate(5deg);} }

.kotoran { position: absolute; font-size: 20px; bottom: 10px; left: 45%; animation: muncul 0.5s; }
@keyframes muncul { from{opacity:0; transform: scale(0);} to{opacity:1; transform: scale(1);} }

.tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
.btn { background: #38bdf8; color: white; border: none; padding: 15px 5px; border-radius: 15px; font-size: 11px; font-weight: bold; box-shadow: 0 4px 0 #0284c7; cursor: pointer; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0284c7; }

#notif { text-align: center; font-weight: bold; color: #dc2626; height: 20px; margin-top: 5px; }
</style>
</head>
<body>

<div class="gotchi">
  <div class="layar">
    <div class="status">
      <div>🍗<div class="bar"><div class="bar-fill" id="lapar-bar"></div></div></div>
      <div>❤️<div class="bar"><div class="bar-fill" id="bahagia-bar"></div></div></div>
      <div>⚡<div class="bar"><div class="bar-fill" id="energi-bar"></div></div></div>
    </div>
    
    <div class="pet-area" id="pet-area">
      <span class="pet" id="pet">🥚</span>
      <div id="umur">Umur: 0 hari</div>
    </div>
    <div id="kotoran-area"></div>
  </div>
  
  <div id="notif"></div>
  
  <div class="tombol">
    <button class="btn" onclick="kasihMakan()">🍗<br>MAKAN</button>
    <button class="btn" onclick="main()">⚽<br>MAIN</button>
    <button class="btn" onclick="bersihin()">🧹<br>BERSIH</button>
    <button class="btn" onclick="tidur()">💤<br>TIDUR</button>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.chicken_gotchi || '{"stage":"telur","umur":0,"lapar":100,"bahagia":100,"energi":100,"bersih":100,"kotor":0,"sakit":false,"lastUpdate":Date.now()}');

function save(){
  data.lastUpdate = Date.now();
  localStorage.chicken_gotchi = JSON.stringify(data);
  render();
}

function render(){
  // Update bar
  document.getElementById('lapar-bar').style.width = data.lapar + '%';
  document.getElementById('bahagia-bar').style.width = data.bahagia + '%';
  document.getElementById('energi-bar').style.width = data.energi + '%';
  
  // Evolusi
  let emoji = '🥚'; let classPet = 'pet';
  if(data.stage === 'bayi') emoji = '🐤';
  if(data.stage === 'remaja') emoji = '🐥';
  if(data.stage === 'dewasa') emoji = '🐔';
  if(data.stage === 'raja') emoji = '👑🐔';
  if(data.sakit) { emoji = '🤒'; classPet += ' sedih'; }
  if(data.stage === 'mati') emoji = '💀';
  
  document.getElementById('pet').innerText = emoji;
  document.getElementById('pet').className = classPet;
  document.getElementById('umur').innerText = `Umur: ${data.umur} hari`;
  
  // Kotoran
  document.getElementById('kotoran-area').innerHTML = '';
  for(let i=0; i<data.kotor; i++){
    let k = document.createElement('div'); k.className = 'kotoran'; k.innerText = '💩';
    k.style.left = 30 + i*20 + '%'; document.getElementById('kotoran-area').appendChild(k);
  }
}

function updateStatus(){
  let now = Date.now();
  let diff = (now - data.lastUpdate) / 1000 / 60; // menit
  
  data.lapar -= diff * 0.5;
  data.bahagia -= diff * 0.3;
  data.energi -= diff * 0.2;
  data.bersih -= diff * 0.1;
  
  if(data.lapar < 20 || data.bahagia < 20) data.sakit = true;
  if(data.lapar <= 0 || data.bahagia <= 0) data.stage = 'mati';
  
  if(data.umur > 1 && data.stage === 'telur') data.stage = 'bayi';
  if(data.umur > 3 && data.stage === 'bayi') data.stage = 'remaja';
  if(data.umur > 7 && data.stage === 'remaja') data.stage = 'dewasa';
  if(data.umur > 14 && data.bahagia > 80) data.stage = 'raja';
  
  if(Math.random() < 0.05) data.kotor = Math.min(3, data.kotor + 1);
  if(data.umur > 0 && Math.floor(now/1000/60/60/24) > data.umur) data.umur++;
  
  data.lapar = Math.max(0, data.lapar);
  data.bahagia = Math.max(0, data.bahagia);
  data.energi = Math.max(0, data.energi);
  data.bersih = Math.max(0, data.bersih);
  
  save();
}

function kasihMakan(){
  if(data.stage === 'mati') return;
  data.lapar = Math.min(100, data.lapar + 30);
  data.bahagia += 5;
  showNotif('Nyam nyam! 😋');
  save();
}
function main(){
  if(data.stage === 'mati' || data.energi < 10) return;
  data.bahagia = Math.min(100, data.bahagia + 20);
  data.energi -= 10;
  showNotif('Asik main! ❤️');
  save();
}
function bersihin(){
  data.kotor = 0;
  data.bersih = 100;
  data.bahagia += 10;
  showNotif('Bersih! ✨');
  save();
}
function tidur(){
  if(data.stage === 'mati') return;
  data.energi = Math.min(100, data.energi + 40);
  data.bahagia -= 5;
  showNotif('Zzz... 😴');
  save();
}

function showNotif(teks){
  document.getElementById('notif').innerText = teks;
  setTimeout(()=> document.getElementById('notif').innerText = '', 2000);
}

// Auto update tiap 10 detik
setInterval(updateStatus, 10000);
render();
</script>
</body>
</html>
