<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Betta Breeding - Peternak Cupang</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#a2e8ff;min-height:100vh;padding:10px}
.top{background:#4fb6d1;border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.money{background:#fff8c8;border-radius:12px;padding:8px 14px;color:#1a3c6e;font-weight:800}
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 0 #2a8daa}
.fish{display:flex;align-items:center;gap:12px;background:#f7fbff;border-radius:16px;padding:10px;margin:8px 0;border:2px solid #cdeeff}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.b{border:none;border-radius:16px;padding:14px;font-weight:800;color:#fff;font-size:16px}
.kawin{background:#ff5a6a}.rawat{background:#2ecc71}.tarung{background:#ff9f1c}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{background:#fff;border:2px dashed #4fb6d1;border-radius:14px;padding:10px;text-align:center}
.log{background:#0f2a3a;color:#7ef0a0;padding:10px;border-radius:12px;font-size:13px;height:110px;overflow:auto;margin-top:10px}
</style>
</head>
<body>
<div class="top"><h3>🐟 BETTA BREEDER GRESIK</h3><div class="money">💰 Rp <span id="duit">500000</span></div></div>
<div class="card">
<h4>📦 INVENTARIS</h4>
<div id="inv"></div>
<div class="btns">
<button class="b kawin" onclick="kawin()">❤️ KAWIN</button>
<button class="b rawat" onclick="rawat()">🌱 RAWAT</button>
<button class="b tarung" onclick="tarung()">⚔️ TARUNG</button>
</div>
<div class="log" id="log">> Selamat datang Peternak! Beli ikan di toko dulu bree...<br></div>
</div>
<div class="card">
<h4>🛒 TOKO IKAN</h4>
<div class="shop">
<div class="sbtn" onclick="beli('Plakat Merah',50000)">🔴 Plakat Merah<br>Rp 50k</div>
<div class="sbtn" onclick="beli('Halfmoon',75000)">🔵 Halfmoon<br>Rp 75k</div>
<div class="sbtn" onclick="beli('Crown Tail',100000)">🟠 Crown Tail<br>Rp 100k</div>
<div class="sbtn" onclick="beli('Plakat Super Red',150000)">⭐ Super Red<br>Rp 150k</div>
</div>
</div>
<script>
let duit=500000;
let fishes=[{nama:'Plakat Merah',lvl:1,jumlah:1},{nama:'Halfmoon',lvl:1,jumlah:0},{nama:'Crown Tail',lvl:1,jumlah:0}];
function render(){
 document.getElementById('duit').innerText=duit.toLocaleString('id-ID');
 let h=''; fishes.forEach(f=>{if(f.jumlah>0)h+=`<div class="fish"><div style="font-size:40px">${f.nama.includes('Plakat')?'🔴':f.nama.includes('Half')?'🔵':'🟠'}</div><div><b>${f.nama}</b><br><small>Level ${f.lvl} - ${f.lvl<3?'Burayak':f.lvl<5?'Remaja':'Dewasa'}</small></div><div style="margin-left:auto;font-weight:800">x${f.jumlah}</div></div>`;});
 if(!h)h='<small>Belum punya ikan!</small>'; document.getElementById('inv').innerHTML=h;
}
function addLog(t){let l=document.getElementById('log');l.innerHTML+='> '+t+'<br>';l.scrollTop=9999;}
function beli(nama,harga){if(duit<harga){addLog('Duit kurang buat '+nama);return;}duit-=harga;let f=fishes.find(x=>x.nama==nama);if(!f)fishes.push({nama,lvl:1,jumlah:1});else f.jumlah++;render();addLog('Beli '+nama);}
function rawat(){let a=fishes.find(f=>f.jumlah>0);if(!a){addLog('Gak ada ikan');return;}a.lvl++;if(a.lvl>5)a.lvl=5;render();addLog(a.nama+' jadi Level '+a.lvl);}
function kawin(){let induk=fishes.filter(f=>f.jumlah>=1&&f.lvl>=4);if(induk.length<2){addLog('Butuh 2 ikan dewasa lvl4+! Rawat dulu!');return;}let anak=induk[Math.floor(Math.random()*induk.length)].nama;let f=fishes.find(x=>x.nama==anak);f.jumlah++;addLog('Kawin sukses! Dapat burayak '+anak);render();}
function tarung(){let p=fishes.find(f=>f.jumlah>0&&f.lvl>=3);if(!p){addLog('Ikan lvl3+ buat tarung!');return;}let ml=Math.floor(Math.random()*5)+1;let menang=p.lvl>=ml||Math.random()>0.4;if(menang){duit+=200000;addLog('⚔️ '+p.nama+' MENANG vs lvl'+ml+'! +200k')}else{p.jumlah--;addLog('💀 '+p.nama+' KALAH vs lvl'+ml+'! Mati 1');}render();}
render();
</script>
</body>
</html>
