<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquarium Cakep - Betta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a2e35;display:flex;justify-content:center;padding:20px;min-height:100vh}
.rack{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:800px}

/* AQUARIUM PRO */
.aquarium{
  width:100%;height:180px;position:relative;
  background:linear-gradient(90deg,rgba(255,255,255,0.3) 0%, transparent 15%, transparent 85%, rgba(255,255,255,0.3) 100%),
            linear-gradient(180deg,#a8e6ff 0%,#6ec8ff 40%,#3aa0d0 100%);
  border:4px solid #e0f0ff;border-radius:16px 16px 8px 8px;
  box-shadow:inset 0 0 20px rgba(255,255,255,0.8), inset 0 -20px 20px rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.4);
  overflow:hidden;cursor:pointer;transition:0.2s
}
.aquarium:hover{transform:scale(1.03);box-shadow:inset 0 0 25px #fff, 0 12px 20px #0006}

/* PASIR */
.sand{
  position:absolute;bottom:0;width:100%;height:24px;
  background:linear-gradient(#f5e6c8,#d9c08a,#a68a5a);
  border-radius:0 0 8px 8px;z-index:1
}
.sand::after{content:'🪨 🐚';position:absolute;top:2px;left:8px;font-size:10px}

/* TANAMAN */
.plant{position:absolute;bottom:20px;font-size:20px;z-index:2}
.plant1{left:6px}.plant2{right:8px;transform:scaleX(-1)}

/* GELEMBUNG */
.bubble{
  position:absolute;width:6px;height:6px;background:radial-gradient(#fff,#a0e0ff);
  border-radius:50%;bottom:24px;animation:bubble 3s infinite linear;opacity:0.8
}
@keyframes bubble{0%{transform:translateY(0) translateX(0);opacity:0.8}100%{transform:translateY(-130px) translateX(8px);opacity:0}}

/* IKAN */
.fish{position:absolute;width:70px;height:70px;object-fit:contain;top:45%;left:25%;z-index:3;animation:swim 3s infinite alternate ease-in-out;filter:drop-shadow(0 2px 4px #0005)}
@keyframes swim{0%{transform:translateX(0) translateY(0) rotate(-2deg)}100%{transform:translateX(35px) translateY(-8px) rotate(3deg)}}

/* CAHAYA KACA */
.glass-light{position:absolute;top:0;left:12%;width:20%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0.5),transparent);transform:skewX(-15deg);z-index:4;pointer-events:none}

/* TAG NAMA */
.tag{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:linear-gradient(#fde8c0,#e8c39a);border:2px solid #5d3a1a;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:800;color:#5d3a1a;z-index:5;white-space:nowrap;box-shadow:0 2px 4px #0004}
</style>
</head>
<body>
<div class="rack" id="rack"></div>

<script>
const names=['Ruby Happy','Aqua Hungry','Violet Happy','Sunny Sleepy','Lemon Happy','Tide Happy','Rosy Hungry','Moss Happy','Cosmo Happy','Pearl Happy'];
let html='';
for(let i=0;i<10;i++){
  html+=`
  <div class="aquarium" onclick="this.querySelector('.fish').style.transform='scale(1.3)'">
    <div class="glass-light"></div>
    <div class="plant plant1">🌿</div>
    <div class="plant plant2">🌱</div>
    <div class="bubble" style="left:20%;animation-delay:0s"></div>
    <div class="bubble" style="left:50%;animation-delay:0.8s"></div>
    <div class="bubble" style="left:75%;animation-delay:1.5s"></div>
    <img class="fish" src="fish_${i}.png" alt="${names[i]}">
    <div class="sand"></div>
    <div class="tag">${names[i]}</div>
  </div>`;
}
document.getElementById('rack').innerHTML=html;
</script>
</body>
</html>
