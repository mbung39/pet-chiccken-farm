<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETTA - Real Cartoon 10 Slot</title>
<style>
body{background:#b8e6b8;display:flex;justify-content:center;margin:0;font-family:sans-serif}
.app{width:480px;background:#e8ffe8}
.top{background:#2d6a55;color:#fff;padding:10px;border-radius:16px;margin:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between;border:3px solid #fff}
.rack{background:#8b5a2b;margin:8px;padding:10px 8px 70px;border-radius:14px;border:4px solid #5d3a1a;position:relative}
.tanks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tank{height:130px;background:linear-gradient(#c4f0ff,#87d9ff);border:3px solid #5d3a1a;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fish{width:70px;height:70px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;border:3px solid #0002;animation:swim 2s infinite alternate}
.fish::after{content:'';position:absolute;right:-18px;top:8px;width:28px;height:38px;background:inherit;border-radius:0 60% 60% 0;border:2px solid #0002}
.fish::before{content:'👀';position:absolute;top:12px;font-size:14px}
.tag{position:absolute;bottom:2px;background:#fde8c0;border:2px solid #5d3a1a;border-radius:6px;font-size:8px;font-weight:800;padding:2px 4px;white-space:nowrap}
@keyframes swim{to{transform:translateX(5px)}}
.shelf{height:12px;background:#c89a6b;margin:10px 0;border-radius:4px;border:2px solid #5d3a1a}
.breed{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#5a6cff;color:#fff;border:3px solid #fff;border-radius:20px;padding:10px 24px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<div class="top"><b>BETTA COLLECTOR</b><span>🪙1240 💎28 🐠42</span><button>Feed All</button></div>
<div class="rack" id="rack"></div>
</div>
<script>
const data=[
{c:'#ff2a2a',n:'Ruby Happy'},{c:'#2a8cff',n:'Aqua Hungry'},{c:'#8a4cff',n:'Violet Happy'},{c:'#ffde2a',n:'Sunny Sleepy'},{c:'#ff8c2a',n:'Lemon Happy'},
{c:'#2aff8c',n:'Tide Happy'},{c:'#ff6fae',n:'Rosy Hungry'},{c:'#ffffff',n:'Moss Happy'},{c:'#1a1a4a',n:'Cosmo Happy'},{c:'#2ac4d4',n:'Pearl Happy'}
];
let html='<div class="tanks">';
data.slice(0,5).forEach(f=>{html+=`<div class="tank"><div class="fish" style="background:${f.c}"></div><div class="tag">${f.n}</div></div>`});
html+='</div><div class="shelf"></div><div class="tanks">';
data.slice(5).forEach(f=>{html+=`<div class="tank"><div class="fish" style="background:${f.c}"></div><div class="tag">${f.n}</div></div>`});
html+='</div><div class="shelf"></div><div class="breed">⭐ Breed Bettas ⭐</div>';
document.getElementById('rack').innerHTML=html;
</script>
</body>
</html>
