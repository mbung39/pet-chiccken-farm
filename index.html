<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BETTA FISH BREEDING</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Fredoka',system-ui}
body{background:#c9f1ff;display:flex;justify-content:center;min-height:100vh}
.phone{width:390px;background:linear-gradient(180deg,#e8fbff 0%,#bdeeff 100%);min-height:100vh;padding-bottom:90px;position:relative}
.status{display:flex;justify-content:space-between;padding:12px 18px;font-weight:600}
.header{margin:8px 16px;background:linear-gradient(180deg,#6ac6dd,#4aa9c5);border-radius:28px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 #2c7d95;border:3px solid #fff}
.money-bar{margin:14px 16px;background:#fff6c1;border:3px solid #fff;border-radius:18px;padding:8px 10px;display:flex;justify-content:space-between;box-shadow:0 4px 0 #e6c86a}
.coin{width:42px;height:42px;background:radial-gradient(#ffe88a,#ffb400);border-radius:50%;border:3px solid #c48a00;display:flex;align-items:center;justify-content:center}
.money-text{color:#1a2e7a;font-size:28px;font-weight:800}
.plus{width:44px;height:44px;background:linear-gradient(#7de07d,#3cb43c);border-radius:14px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
.inventory-box{margin:12px 16px;background:linear-gradient(#9eddf0,#6bc4df);border-radius:24px;padding:10px;border:3px solid #fff;box-shadow:0 4px 0 #2c7d95}
.inv-title{color:#0a3a5a;font-size:20px;font-weight:800;text-align:center;padding:6px}
.fish-card{background:#fffdf5;border-radius:20px;padding:12px 14px;display:flex;gap:12px;margin:10px 6px;box-shadow:0 4px 0 #2c7d95}
.fish-icon{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px}
.level-badge{padding:2px 10px;border-radius:10px;color:#fff;font-size:14px;font-weight:700}
.lvl5{background:#42c07a}.lvl3{background:#8a7bdf}.lvl4{background:#ff9f2e}
.aksi-title{color:#0a3a5a;font-size:24px;font-weight:800;text-align:center;margin:14px 0 10px}
.aksi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 16px}
.aksi-btn{border-radius:20px;padding:14px 6px;border:3px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,0.25);color:#fff;font-weight:800;font-size:20px;text-align:center;cursor:pointer}
.btn-kawin{background:linear-gradient(#ff7a8a,#e94056)}.btn-rawat{background:linear-gradient(#7de07d,#2db82d)}.btn-tarung{background:linear-gradient(#ffbd59,#ff8a1a)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:390px;background:#fff;border-radius:24px 24px 0 0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:10px 0 18px;text-align:center}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span>09:41</span><span>📶 84%</span></div>
<div class="header"><div style="display:flex;gap:10px;align-items:center"><div style="font-size:48px">🐟</div><h1 style="color:#fff;text-shadow:0 2px 0 #2c7d95">BETTA FISH<br>BREEDING</h1></div><div style="font-size:36px">⚙️</div></div>
<div class="money-bar"><div style="display:flex;gap:8px;align-items:center"><div class="coin">💰</div><div class="money-text">Rp 500.000</div></div><div class="plus" onclick="alert('Nambah duit +500k!')">+</div></div>
<div class="inventory-box">
<div style="text-align:center;color:#0a3a5a;font-weight:800">✨ INVENTARIS IKAN CUPANG ✨</div>
<div class="fish-card"><div class="fish-icon" style="background:#ffb3b3">🔴</div><div><b>Plakat Merah</b><br><span class="level-badge lvl5">Level 5</span></div><div style="margin-left:auto;text-align:right"><b>x3</b><br><small>Sehat • Siap Kawin</small></div></div>
<div class="fish-card"><div class="fish-icon" style="background:#c3bfff">🔵</div><div><b>Halfmoon</b><br><span class="level-badge lvl3">Level 3</span></div><div style="margin-left:auto;text-align:right"><b>x2</b><br><small>Sehat • Enerjik</small></div></div>
<div class="fish-card"><div class="fish-icon" style="background:#ffcf8a">🟠</div><div><b>Crown Tail</b><br><span class="level-badge lvl4">Level 4</span></div><div style="margin-left:auto;text-align:right"><b>x1</b><br><small>Sehat • Aktif</small></div></div>
</div>
<div class="aksi-title">🐟 AKSI</div>
<div class="aksi-grid">
<div class="aksi-btn btn-kawin" onclick="alert('Kawin sukses!')">❤️<br>Kawin</div>
<div class="aksi-btn btn-rawat" onclick="alert('Dirawat! Level naik!')">🌱<br>Rawat</div>
<div class="aksi-btn btn-tarung" onclick="alert('Tarung menang +200k!')">⚔️<br>Tarung</div>
</div>
<div class="bottom-nav"><div>🏠<br>Beranda</div><div>🐟<br>Inventaris</div><div>🛒<br>Toko</div><div>📋<br>Tugas</div></div>
</div>
</body>
</html>
