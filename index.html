<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chicken Gotchi V5.0</title>
<style>
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
body { background: #c4f1f9; color: #1a2e05; font-family: 'Comic Sans MS', cursive; padding: 10px; margin: 0; display: flex; justify-content: center; }
.gotchi { width: 100%; max-width: 350px; background: #f0f9ff; border: 8px solid #38bdf8; border-radius: 40px; padding: 15px; box-shadow: 0 10px 0 #0284c7; }
.layar { background: #d9f99d; border: 4px solid #65a30d; border-radius: 20px; padding: 10px; height: 300px; position: relative; overflow: hidden; }
.umur { text-align: center; font-size: 14px; font-weight: bold; color: #365314; }
.level { text-align: center; font-size: 18px; font-weight: bold; color: #ca8a04; text-shadow: 1px 1px 2px white; }

.kandang { 
  position: absolute; 
  top: 90px; 
  left: 15px; 
  right: 15px; 
  bottom: 65px; 
  border: 4px solid #fb923c;
  border-radius: 10px; 
  background: transparent;
  pointer-events: none;
}
.pet-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; }
.pet { 
  width: 100px;
  height: 100px;
  position: relative;
  transition: transform 0.3s;
}

/* ANIMASI */
@keyframes idle { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-3px);} }
@keyframes walk { 0%,100%{transform: translateY(0) rotate(0deg);} 25%{transform: translateY(-5px) rotate(-2deg);} 75%{transform: translateY(-5px) rotate(2deg);} }
@keyframes eat { 0%,100%{transform: translateY(0);} 50%{transform: translateY(8px);} }
@keyframes play { 0%,100%{transform: translateY(0) rotate(0deg);} 50%{transform: translateY(-15px) rotate(360deg);} }
@keyframes sleep { 0%,100%{opacity:1;} 50%{opacity:0.7;} }
@keyframes wing { 0%,100%{transform: rotate(0deg);} 50%{transform: rotate(20deg);} }

.idle-anim { animation: idle 2s infinite; }
.walk-anim { animation: walk 0.5s infinite; }
.eat-anim { animation: eat 0.3s 3; }
.play-anim { animation: play 0.6s 2; }
.sleep-anim { animation: sleep 2s infinite; }

.wing { transform-origin: bottom; }
.wing-anim { animation: wing 0.3s infinite; }

.xp-container { margin-top: 8px; }
.xp-text { font-size: 12px; text-align: center; font-weight: bold; color: #a16207; }
.xp-bar { width: 100%; height: 12px; background: #a3e635; border-radius: 10px; border: 2px solid #65a30d; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 0.3s; }

.timer { text-align: center; font-size: 14px; color: #dc2626; font-weight: bold; }
.status { display: flex; justify-content: space-around; font-size: 11px; position: absolute; bottom: 10px; left: 0; right: 0; }
.bar { width: 50px; height: 8px; background: #a3e635; border-radius: 5px; overflow: hidden; border: 2px solid #65a30d; }
.bar-fill { height: 100%; background: #22c55e; transition: width 0.3s; }
.progres { position: absolute; top: 45px; left: 10px; right: 10px; text-align: center; font-size: 12px; font-weight: bold; }
.tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
.btn { background: #38bdf8; color: white; border: none; padding: 15px 5px; border-radius: 15px; font-size: 11px; font-weight: bold; box-shadow: 0 4px 0 #0284c7; }
.btn:active { transform: translateY(2px); }
#notif { text-align: center; font-weight: bold; color: #dc2626; height: 20px; }
.evo-flash { animation: flash 0.5s 3; }
@keyframes flash { 0%,100%{filter: brightness(1);} 50%{filter: brightness(3) hue-rotate(90deg);} }
</style>
</head>
<body>

<div class="gotchi">
  <div class="layar">
    <div class="umur" id="umur">Umur: 0 Hari</div>
    <div class="level" id="level"></div>
    <div class="timer" id="timer"></div>
    <div class="progres" id="progres"></div>
    
    <div class="kandang">
      <div class="pet-area">
        <div class="pet idle-anim" id="pet"></div>
      </div>
    </div>
    
    <div class="xp-container" id="xp-container" style="display:none;">
      <div class="xp-text" id="xp-text">EXP: 0/300</div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    </div>
    
    <div class="status">
      <div>🍗<div class="bar"><div class="bar-fill" id="lapar-bar"></div></div></div>
      <div>❤️<div class="bar"><div class="bar-fill" id="bahagia-bar"></div></div></div>
      <div>⚡<div class="bar"><div class="bar-fill" id="energi-bar"></div></div></div>
    </div>
  </div>
  
  <div id="notif"></div>
  
  <div class="tombol">
    <button class="btn" onclick="kasihMakan()">🍗<br>MAKAN<br>+3 EXP</button>
    <button class="btn" onclick="main()">⚽<br>MAIN<br>+2 EXP</button>
    <button class="btn" onclick="bersihin()">🧹<br>BERSIH<br>+1 EXP</button>
    <button class="btn" onclick="tidur()">💤<br>TIDUR<br>+1 EXP</button>
  </div>
</div>

<script>
if(!localStorage.chicken_gotchi_v4){
  localStorage.chicken_gotchi_v4 = JSON.stringify({
    stage:"telur","umur":0,"lvl":1,"xp":0,"pakanCount":0,"targetXp":20,
    "lapar":100,"bahagia":100,"energi":100,"startTime":Date.now()
  });
}

let data = JSON.parse(localStorage.chicken_gotchi_v4);

const ayamSVG = {
  telur: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="35" ry="45" fill="#fff8dc" stroke="#ddd" stroke-width="3"/><path d="M45 40 Q50 35 55 40" stroke="#ccc" stroke-width="2" fill="none"/></svg>`,
  
  bayi: `<svg viewBox="0 0 100 100">
    <circle cx="50" cy="65" r="28" fill="#FFD700"/>
    <circle cx="50" cy="40" r="20" fill="#FFD700"/>
    <ellipse class="wing" cx="30" cy="60" rx="12" ry="18" fill="#FFC700"/>
    <ellipse class="wing" cx="70" cy="60" rx="12" ry="18" fill="#FFC700"/>
    <circle cx="42" cy="35" r="4" fill="black"/>
    <circle cx="58" cy="35" r="4" fill="black"/>
    <path d="M48 42 L52 42 L50 46 Z" fill="orange"/>
  </svg>`,
  
  remaja: `<svg viewBox="0 0 100 100">
    <circle cx="50" cy="65" r="30" fill="#FFF8DC"/>
    <circle cx="50" cy="38" r="22" fill="#FFF8DC"/>
    <path d="M45 25 L50 15 L55 25" fill="#DC2626"/>
    <ellipse class="wing" cx="28" cy="60" rx="14" ry="20" fill="#F0E68C"/>
    <ellipse class="wing" cx="72" cy="60" rx="14" ry="20" fill="#F0E68C"/>
    <circle cx="42" cy="33" r="4" fill="black"/>
    <circle cx="58" cy="33" r="4" fill="black"/>
    <path d="M48 40 L52 40 L50 44 Z" fill="orange"/>
  </svg>`,
  
  dewasa1: `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="70" r="32" ry="28" fill="white"/>
    <circle cx="50" cy="40" r="24" fill="white"/>
    <path d="M44 22 L50 8 L56 22" fill="#DC2626"/>
    <ellipse class="wing" cx="25" cy="65" rx="16" ry="22" fill="#F5F5F5"/>
    <ellipse class="wing" cx="75" cy="65" rx="16" ry="22" fill="#F5F5F5"/>
    <path d="M20 75 Q30 60 40 75" fill="white"/>
    <circle cx="42" cy="35" r="5" fill="black"/>
    <circle cx="58" cy="35" r="5" fill="black"/>
    <path d="M47 43 L53 43 L50 48 Z" fill="orange"/>
  </svg>`,
  
  dewasa2: `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="70" r="34" ry="30" fill="#F0F0F0"/>
    <circle cx="50" cy="38" r="26" fill="#F0F0F0"/>
    <path d="M40 18 L50 3 L60 18" fill="#B91C1C"/>
    <ellipse class="wing" cx="22" cy="65" rx="18" ry="24" fill="#E5E5E5"/>
    <ellipse class="wing" cx="78" cy="65" rx="18" ry="24" fill="#E5E5E5"/>
    <path d="M15 75 Q30 55 45 75" fill="#B91C1C"/>
    <circle cx="40" cy="32" r="5" fill="black"/>
    <circle cx="60" cy="32" r="5" fill="black"/>
    <path d="M46 41 L54 41 L50 46 Z" fill="#EA580C"/>
    <text x="50" y="85" font-size="10" text-anchor="middle">💪</text>
  </svg>`,
  
  dewasa3: `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="70" r="35" ry="31" fill="#FFFACD"/>
    <circle cx="50" cy="36" r="27" fill="#FFFACD"/>
    <path d="M32 12 L38 2 L44 12 L50 -2 L56 12 L62 2 L68 12" fill="gold"/>
    <ellipse class="wing" cx="20" cy="65" rx="19" ry="25" fill="#FAFAD2"/>
    <ellipse class="wing" cx="80" cy="65" rx="19" ry="25" fill="#FAFAD2"/>
    <path d="M10 75 Q30 50 50 75" fill="gold"/>
    <circle cx="38" cy="30" r="5" fill="black"/>
    <circle cx="62" cy="30" r="5" fill="black"/>
    <rect x="28" y="85" width="44" height="12" fill="purple" opacity="0.6"/>
  </svg>`,
  
  dewasa4: `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="70" r="36" ry="32" fill="#1F2937"/>
    <circle cx="50" cy="34" r="28" fill="#1F2937"/>
    <path d="M30 10 L36 0 L42 10 L50 -5 L58 10 L64 0 L70 10" fill="#DC2626"/>
    <ellipse class="wing" cx="18" cy="65" rx="20" ry="26" fill="#374151"/>
    <ellipse class="wing" cx="82" cy="65" rx="20" ry="26" fill="#374151"/>
    <path d="M5 75 Q30 45 55 75" fill="#DC2626" opacity="0.7"/>
    <circle cx="36" cy="28" r="6" fill="red"/>
    <circle cx="64" cy="28" r="6" fill="red"/>
  </svg>`
};

function save(){
  localStorage.chicken_gotchi_v4 = JSON.stringify(data);
  render();
}

function getDewasaSVG(){
  if(data.lvl >= 30) return ayamSVG.dewasa4;
  if(data.lvl >= 20) return ayamSVG.dewasa3;
  if(data.lvl >= 10) return ayamSVG.dewasa2;
  return ayamSVG.dewasa1;
}

function setAnimasi(nama){
  let pet = document.getElementById('pet');
  pet.className = 'pet ' + nama;
}

function render(){
  document.getElementById('lapar-bar').style.width = data.lapar + '%';
  document.getElementById('bahagia-bar').style.width = data.bahagia + '%';
  document.getElementById('energi-bar').style.width = data.energi + '%';
  
  let svg = ayamSVG.telur;
  if(data.stage === 'bayi') svg = ayamSVG.bayi;
  if(data.stage === 'remaja') svg = ayamSVG.remaja;
  if(data.stage === 'dewasa') svg = getDewasaSVG();
  
  document.getElementById('pet').innerHTML = svg;
  
  let scale = 1 + Math.floor(data.lvl / 10) * 0.2;
  document.getElementById('pet').style.transform = `scale(${scale})`;
  
  document.getElementById('umur').innerText = `Umur: ${data.umur} Hari`;
  
  if(data.stage === 'telur'){
    let sisa = 10 - Math.floor((Date.now() - data.startTime) / 1000);
    document.getElementById('timer').innerText = sisa > 0 ? `Netas dalam: ${sisa} detik` : '';
  } else {
    document.getElementById('timer').innerText = '';
  }
  
  if(data.stage === 'dewasa'){
    document.getElementById('level').innerText = `LVL ${data.lvl}`;
    document.getElementById('progres').innerText = `XP: ${data.xp}/${data.targetXp}`;
    document.getElementById('xp-container').style.display = 'block';
    document.getElementById('xp-text').innerText = `EXP: ${data.xp}/${data.targetXp}`;
    let persen = (data.xp / data.targetXp) * 100;
    document.getElementById('xp-fill').style.width = persen + '%';
  } else {
    document.getElementById('level').innerText = '';
    document.getElementById('progres').innerText = `Progress: ${data.pakanCount}/${data.targetXp} Pakan`;
    document.getElementById('xp-container').style.display = 'none';
  }
}

function tambahXP(jumlah){
  if(data.stage === 'dewasa'){
    data.xp += jumlah;
    cekLevelUp();
  }
}

function cekLevelUp(){
  if(data.xp >= data.targetXp){
    data.lvl++; data.xp = 0; 
    data.targetXp = 20 + (data.lvl - 1) * 15;
    
    if(data.lvl % 10 === 0){
      document.getElementById('pet').classList.add('evo-flash');
      setTimeout(()=> document.getElementById('pet').classList.remove('evo-flash'), 1500);
      showNotif(`🔥 EVOLUSI! AYAM JADI LEBIH GARANG! LVL ${data.lvl} 🔥`);
    } else {
      showNotif(`🎉 NAIK KE LVL ${data.lvl}!`);
    }
  }
}

function cekEvolusi(){
  let elapsed = (Date.now() - data.startTime) / 1000;
  
  if(data.stage === 'telur' && elapsed >= 10){
    data.stage = 'bayi'; data.targetXp = 15; data.pakanCount = 0;
    showNotif('🎉 SELAMAT! TELUR NETAS JADI ANAK AYAM!');
  }
  else if(data.stage === 'bayi' && data.pakanCount >= 20){
    data.stage = 'remaja'; data.targetXp = 20; data.pakanCount = 0;
    showNotif('🎉 NAIK LEVEL! JADI AYAM REMAJA!');
  }
  else if(data.stage === 'remaja' && data.pakanCount >= 20){
    data.stage = 'dewasa'; data.xp = 0; data.targetXp = 20;
    showNotif('🎉 NAIK LEVEL! JADI AYAM DEWASA LVL 1!');
  }
}

function kasihMakan(){
  if(data.stage === 'mati') return;
  setAnimasi('eat-anim');
  setTimeout(()=> setAnimasi('idle-anim'), 1000);
  data.lapar = Math.min(100, data.lapar + 20);
  data.pakanCount++;
  tambahXP(3);
  cekEvolusi();
  showNotif('+3 EXP!');
  save();
}
function main(){ 
  if(data.energi < 10) return; 
  setAnimasi('play-anim');
  setTimeout(()=> setAnimasi('idle-anim'), 1200);
  data.bahagia = Math.min(100, data.bahagia + 15); 
  data.energi -= 10; 
  tambahXP(2);
  showNotif('+2 EXP!'); 
  save(); 
}
function bersihin(){ 
  setAnimasi('walk-anim');
  setTimeout(()=> setAnimasi('idle-anim'), 2000);
  data.bahagia += 10; 
  tambahXP(1);
  showNotif('+1 EXP!'); 
  save(); 
}
function tidur(){ 
  setAnimasi('sleep-anim');
  data.energi = Math.min(100, data.energi + 30); 
  tambahXP(1);
  showNotif('Zzz +1 EXP'); 
  save(); 
}
function showNotif(teks){ document.getElementById('notif').innerText = teks; setTimeout(()=> document.getElementById('notif').innerText = '', 2000); }

// IDLE RANDOM
setInterval(()=>{
  if(Math.random() > 0.7 && data.stage !== 'telur'){
    document.querySelectorAll('.wing').forEach(w => w.classList.add('wing-anim'));
    setTimeout(()=> document.querySelectorAll('.wing').forEach(w => w.classList.remove('wing-anim')), 600);
  }
}, 3000);

setInterval(()=>{ 
  cekEvolusi();
  let hari = Math.floor((Date.now() - data.startTime) / 1000 / 60 / 60 / 24);
  if(hari > data.umur) data.umur = hari;
  save();
}, 2500);

save();
</script>
</body>
</html>
